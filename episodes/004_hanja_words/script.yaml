      - {word: 배추, icon: icon:leafy_green, path: '白菜 (중국 발음) → 배추', at: 0}
      - {word: 썰매, icon: icon:sled, path: '雪馬 → 썰매', at: 0}
      - {word: 짐승, icon: icon:paw_prints, path: '衆生 → 짐승', at: 0}
    say:
      - 정리해 보면, 우리가 순우리말로 알던 많은 말이 한자에서 출발해, 수백 년 동안 소리가 닳고 바뀌며 지금의 모습이 되었습니다.
      - 그중에는 김치처럼, 실수를 바로잡으려다 생긴 이름도 있었죠.

  - type: sources
