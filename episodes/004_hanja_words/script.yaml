scenes:
  - type: hook
    word: 김치
    icon: icon:jar
    icon_at: 0.3
    reveal: 沈菜(침채)
    reveal_at: 1
    say:
      - 우리 밥상에 빠지지 않는 김치.
      - say: 그런데 이 김치, 순우리말이 아니라 한자어 침채에서 온 말이라는 거 알고 계셨나요?
        sub: 그런데 이 김치, 순우리말이 아니라 한자어 ‘침채(沈菜)’에서 온 말이라는 거 알고 계셨나요?
      - 김치뿐 아니라 사냥, 성냥, 배추, 그리고 짐승까지. 오늘은 순우리말처럼 들리지만, 한자에서 온 말들을 해체해 봅니다.

  - type: intro_shatter
    name: 단어해체소
    accent_from: 2
    hold: 2.6

  - type: title
    title: "김치도\n한자어였다"
    subtitle: 알고 보니 한자였던 우리말
    hold: 3.4

  # ================================================================ 1. 단어의 족보
  - type: chapter
    chapter: 단어의 족보
    num: 1
    title: 단어의 족보
    icon: icon:scroll
    subtitle: 우리말어휘역사사전
    say:
      - 단어에도 족보가 있습니다.

  - type: chain
    title: '‘사냥’의 족보'
    icon: icon:bow_and_arrow
    steps:
      - {lang: 15세기, word: 山行, reading: 산행}
      - {lang: 16세기, word: 산ᄒᆡᆼ, reading: 옛 한글 표기}
      - {lang: 18세기, word: 산영, reading: ‘ㅎ’이 빠짐}
      - {lang: 20세기, word: 사냥, reading: 지금의 말}
    reveal: [1, 2, 3, 4]
    note: '“山行을 하거나” = 사냥을 하거나 (1447년 석보상절)'
    note_at: 1.5
    say:
      - 국립국어원의 우리말어휘역사사전은, 한 단어가 세기마다 옛 문헌에 어떤 모습으로 적혔는지 보여 줍니다.
      - say: 예를 들어 사냥은, 천사백사십칠 년, 석가모니의 일대기를 한글로 엮은 석보상절에, 한자로 산행이라고 적혀 있습니다. 산에 간다는 그 산행이죠.
        sub: 예를 들어 사냥은, 1447년, 석가모니의 일대기를 한글로 엮은 『석보상절』에, 한자로 ‘산행(山行)’이라고 적혀 있습니다. 산에 간다는 그 산행이죠.
      - 십육 세기부터는 한글로 적히기 시작했고,
      - say: 십팔 세기에는 가운데 히읗 소리가 빠진 산영이 나타납니다.
        sub: 18세기에는 가운데 ‘ㅎ’ 소리가 빠진 ‘산영’이 나타납니다.
      - 그리고 이십 세기에 지금의 사냥이 홀로 쓰이기 시작해, 그대로 굳어졌습니다.

  # ================================================================ 2. 소리가 닳은 말
  - type: chapter
    chapter: 소리가 닳은 말
    num: 2
    title: 소리가 닳은 말
    icon: icon:fire
    subtitle: 성냥과 숭늉
    say:
      - 사냥처럼, 오랜 세월 소리가 닳아서 한자의 모습을 잃어버린 말들이 있습니다.

  - type: chain
    title: '‘성냥’의 족보'
    icon: icon:fire
    steps:
      - {lang: 한자어, word: 石硫黃, reading: '석유황 (= 유황)'}
      - {lang: 17~19세기, word: 셕뉴황, reading: 약재 이름}
      - {lang: 19세기, word: 셕냥, reading: 서양 성냥의 이름}
      - {lang: 20세기, word: 성냥, reading: 지금의 말}
    reveal: [0, 1, 3, 3.6]
    note: '원래의 유황은 ‘석유황’이라는 이름으로 따로 남았다'
    note_at: 3.5
    say:
      - say: 성냥의 뿌리는 돌 석 자를 앞에 붙인 석유황, 그러니까 유황입니다.
        sub: 성냥의 뿌리는 ‘돌 석(石)’ 자를 앞에 붙인 ‘석유황(石硫黃)’, 그러니까 유황입니다.
      - 유황은 예로부터 약재나 화약 재료로 쓰여서, 옛 의학책에 셕류황, 셕뉴황 같은 모습으로 나옵니다.
      - say: 그러다 십구 세기, 유황을 재료로 만든 서양 성냥이 들어오자, 이 새 물건에 셕뉴황이라는 이름을 붙인 것으로 보입니다.
        sub: 그러다 19세기, 유황을 재료로 만든 서양 성냥이 들어오자, 이 새 물건에 ‘셕뉴황’이라는 이름을 붙인 것으로 보입니다.
      - 그 이름이 셕냥을 거쳐 성냥이 되었고,
      - 원래의 유황은 석유황이라는 이름으로 따로 남았죠.

  - type: chain
    title: '‘숭늉’의 족보'
    icon: icon:teacup_without_handle
    steps:
      - {lang: 한자어, word: 熟冷, reading: 숙랭}
      - {lang: 옛말, word: 슝농}
      - {lang: 지금, word: 숭늉}
    reveal: [0, 0.6, 1]
    say:
      - say: 밥을 푼 솥에 물을 부어 데운 숭늉도, 표준국어대사전은 한자어 숙랭에서 왔다고 적고 있습니다.
        sub: 밥을 푼 솥에 물을 부어 데운 숭늉도, 표준국어대사전은 한자어 ‘숙랭(熟冷)’에서 왔다고 적고 있습니다.
      - say: 슝농을 거쳐 숭늉이 되었죠.
        sub: ‘슝농’을 거쳐 숭늉이 되었죠.

  # ================================================================ 3. '오'가 '우'로
  - type: chapter
    chapter: '‘오’가 ‘우’로'
    num: 3
    title: '‘오’가 ‘우’로'
    icon: icon:cherries
    subtitle: 앵두, 자두, 호두, 대추
    say:
      - 이번엔 과일입니다. 앵두, 자두, 호두, 대추. 모두 한자어에서 왔습니다.

  - type: theories
    title: 과일 이름의 공통점
    cards:
      - {label: 櫻桃, head: 앵두, chain: [앵도, 앵두], body: "순우리말 이름은 ‘이스라지’", at: 0}
      - {label: 紫桃, head: 자두, chain: [자도, 자두], at: 0.3}
      - {label: 胡桃, head: 호두, chain: [호도, 호두], at: 0.6}
      - {label: 大棗, head: 대추, chain: [대초, 대추], at: 0.9}
    say:
      - 앵두는 앵도, 자두는 자도, 호두는 호도에서 왔는데, 모두 둘째 글자의 오가 우로 바뀌었습니다.
      - 근대 국어 시기, 그러니까 대략 조선 후기에, 둘째 음절 이하의 오가 우로 바뀌는 일이 많았다고 합니다. 대추도 대초에서 대추가 되었죠.
      - 앵두에는 원래 이스라지라는 순우리말 이름도 있었는데, 지금은 한자에서 온 앵두가 널리 쓰입니다.

  # 호두: 설과 반론
  - type: theories
    title: 호두는 언제 들어왔을까
    cards:
      - label: 널리 알려진 이야기
        head: 1290년, 유청신
        body: "고려 때 중국에 사신으로 다녀온\n유청신이 호두를 가져와\n천안에 심었다"
        at: 1
      - label: 반론
        head: 그 전에도 있었다
        body: "더 앞선 의학책 『향약구급방』에\n이미 ‘胡桃’가 나온다\n(다만 지금 남은 책은 1417년 판)"
        at: 2
    say:
      - say: 호두의 호는 오랑캐 호 자로, 호두는 다른 곳에서 온 복숭아라는 뜻입니다. 이란에서 중국을 거쳐 전해진 열매죠.
        sub: 호두의 ‘호(胡)’는 ‘오랑캐 호’ 자로, 호두는 ‘다른 곳에서 온 복숭아’라는 뜻입니다. 이란에서 중국을 거쳐 전해진 열매죠.
      - say: 우리나라에는, 고려 때인 천이백구십 년, 유청신이라는 사람이 중국에서 가져와 천안에 심었다는 이야기가 널리 알려져 있습니다.
        sub: 우리나라에는, 고려 때인 1290년, 유청신이라는 사람이 중국에서 가져와 천안에 심었다는 이야기가 널리 알려져 있습니다.
      - say: 하지만 그보다 앞서 편찬된 의학책 향약구급방에, 이미 호두가 실려 있다는 반론이 있습니다.
        sub: 하지만 그보다 앞서 편찬된 의학책 『향약구급방』에, 이미 호두가 실려 있다는 반론이 있습니다.
      - say: 다만 지금 남은 향약구급방은 천사백십칠 년에 다시 찍은 책이라, 정확한 시기를 단정하기는 어렵습니다. 그래도 유청신 이전에 이미 들어왔다고 보기도 하죠.
        sub: 다만 지금 남은 『향약구급방』은 1417년에 다시 찍은 책이라, 정확한 시기를 단정하기는 어렵습니다. 그래도 유청신 이전에 이미 들어왔다고 보기도 하죠.

  # ================================================================ 4. 중국 발음 그대로
  - type: chapter
    chapter: 중국어에서 빌려 온 말
    num: 4
    title: 중국어에서 빌려 온 말
    icon: icon:leafy_green
    subtitle: 배추, 무명, 그리고 상추
    say:
      - 그런데 한자어라고 다 우리 한자음으로 읽은 건 아닙니다.

  - type: theories
    title: 우리 한자음과 다른 말
    cards:
      - label: 白菜
        head: 배추
        body: "우리 한자음 ‘백채’가 아니라\n중국어 발음에서 온 말\n16세기 ‘ᄇᆡᄎᆡ’"
        at: 0
      - label: 木綿
        head: 무명
        body: "중국어 발음 ‘mùmián’에서 온 말\n우리 한자음 ‘목면’은 따로 남아\n식물 이름으로도 쓰인다"
        at: 2
      - label: 生菜
        head: 상추
        chain: [상치, 상추]
        body: "‘배추’, ‘고추’를 따라\n바뀌었을 가능성\n1988년 표준어"
        at: 4
    say:
      - say: 배추는 하얀 채소라는 뜻의 백채에서 왔는데, 우리 한자음 백채가 아니라, 중국어 발음에서 들어온 말입니다.
        sub: 배추는 ‘하얀 채소’라는 뜻의 ‘백채(白菜)’에서 왔는데, 우리 한자음 ‘백채’가 아니라, 중국어 발음에서 들어온 말입니다.
      - say: 그래서 십육 세기 문헌에도 백채가 아닌 배채에 가까운 모습으로 적혔고, 이것이 배추가 되었습니다.
        sub: 그래서 16세기 문헌에도 ‘백채’가 아닌 ‘ᄇᆡᄎᆡ’로 적혔고, 이것이 배추가 되었습니다.
      - say: 무명도 마찬가지입니다. 목면의 중국어 발음을 빌려 온 말이죠. 나무 목 자가 모로 읽히는 모과도 같은 예입니다.
        sub: 무명도 마찬가지입니다. ‘목면(木綿)’의 중국어 발음을 빌려 온 말이죠. ‘나무 목(木)’ 자가 ‘모’로 읽히는 ‘모과(木果)’도 같은 예입니다.
      - 우리 한자음으로 읽은 목면도 따로 남아서, 같은 뿌리의 두 말이 함께 쓰입니다.
      - say: 상추도 중국어에서 들어온 말로, 어원은 생채라는 한자어입니다. 오랫동안 상치라고 했는데, 배추나 고추에 이끌려 상추가 되었을 가능성이 있다고 합니다.
        sub: 상추도 중국어에서 들어온 말로, 어원은 ‘생채(生菜)’라는 한자어입니다. 오랫동안 ‘상치’라고 했는데, 배추나 고추에 이끌려 상추가 되었을 가능성이 있다고 합니다.
      - say: 상추가 표준어가 된 건 천구백팔십팔 년이고, 순우리말 이름으로는 부루가 있습니다.
        sub: 상추가 표준어가 된 건 1988년이고, 순우리말 이름으로는 ‘부루’가 있습니다.

  # ================================================================ 5. 우리가 만든 한자어
  - type: chapter
    chapter: 우리가 만든 한자어
    num: 5
    title: 우리가 만든 한자어
    icon: icon:jar
    subtitle: 김치와 썰매
    say:
      - 이제 오늘의 주인공, 김치입니다.

  - type: chain
    title: '‘김치’의 족보'
    icon: icon:jar
    steps:
      - {lang: 한자어, word: 沈菜, reading: 침채}
      - {lang: 16세기, word: 딤ᄎᆡ, reading: 옛 한자음}
      - {lang: 17세기, word: 짐ᄎᆡ, reading: ‘디’가 ‘지’로}
      - {lang: 19세기, word: 김치, reading: ‘짐’을 ‘김’으로 고침}
    reveal: [0, 2, 3, 6]
    note: '중국어에서는 ‘沈’을 채소 절임에 쓴 예가 보이지 않는다 → 우리나라에서 만든 한자어'
    note_at: 1
    say:
      - say: 김치는 한자어 침채에서 왔습니다.
        sub: 김치는 한자어 ‘침채(沈菜)’에서 왔습니다.
      - 그런데 중국어에서는 이 침 자를 채소 절임에 쓴 예가 보이지 않는다고 합니다. 그래서 침채는, 우리나라에서 만든 한자어로 봅니다.
      - say: 십육 세기 문헌에는 옛 한자음이 반영된 딤채, 팀채 같은 모습으로 나오고,
        sub: 16세기 문헌에는 옛 한자음이 반영된 ‘딤ᄎᆡ’, ‘팀ᄎᆡ’ 같은 모습으로 나오고,
      - say: 십칠 세기에는 디가 지로 바뀌는 변화를 거쳐 짐채가 됩니다.
        sub: 17세기에는 ‘디’가 ‘지’로 바뀌는 변화를 거쳐 ‘짐ᄎᆡ’가 됩니다.
      - 그런데 그 무렵 남부 지방에서는, 길을 질이라고 하는 것처럼, 기가 지로 바뀌는 일이 흔했습니다.
      - 그래서 사람들은 짐채의 짐도, 원래 김이었는데 사투리처럼 바뀐 거라고 잘못 알고, 김으로 되돌려 적었습니다. 이런 걸 과도 교정이라고 하죠.
      - say: 그렇게 십구 세기에 김치가 나타났습니다. 김치의 김은, 실수를 바로잡으려다 생긴 소리인 셈입니다.
        sub: 그렇게 19세기에 ‘김치’가 나타났습니다. 김치의 ‘김’은, 실수를 바로잡으려다 생긴 소리인 셈입니다.

  # 썰매: 우리가 만든 한자어 + 설과 반론
  - type: tableau
    title: 썰매는 ‘눈 위의 말’
    layers:
      - {img: icon:sled, x: 0.26, y: 0.44, size: 260, at: 0, motion: float, short: {x: 0.5, y: 0.22, size: 220}}
      - {img: icon:scroll, x: 0.74, y: 0.44, size: 220, at: 1, motion: float, short: {x: 0.5, y: 0.6, size: 190}}
    texts:
      - {text: '雪馬 (설마) → 썰매', x: 0.26, y: 0.7, size: 52, at: 0, color: accent, font: serif_bold,
         short: {x: 0.5, y: 0.38, size: 48}}
      - {text: '눈 설 · 말 마', x: 0.26, y: 0.79, size: 38, at: 0.3, short: {x: 0.5, y: 0.45}}
      - {text: '1435년 『세종실록』', x: 0.74, y: 0.7, size: 52, at: 1, color: accent, font: serif_bold,
         short: {x: 0.5, y: 0.76, size: 48}}
      - {text: '설마로 눈길에 쌀을 실어 보냄', x: 0.74, y: 0.79, size: 38, at: 1.3, short: {x: 0.5, y: 0.83}}
    say:
      - say: 썰매도 우리나라에서 만든 한자어, 눈 설 자에 말 마 자를 쓴 설마에서 왔습니다.
        sub: 썰매도 우리나라에서 만든 한자어, ‘눈 설(雪)’ 자에 ‘말 마(馬)’ 자를 쓴 ‘설마(雪馬)’에서 왔습니다.
      - say: 천사백삼십오 년 세종실록에는, 지금의 함경북도 길주 북쪽에 눈이 많이 와 사람들이 다니지 못하자, 설마를 타는 사람들에게 쌀을 실어 보내 구제했다는 기록이 나옵니다.
        sub: 1435년 『세종실록』에는, 지금의 함경북도 길주 북쪽에 눈이 많이 와 사람들이 다니지 못하자, 설마를 타는 사람들에게 쌀을 실어 보내 구제했다는 기록이 나옵니다.

  - type: theories
    title: 썰매는 ‘끄는 말’?
    cards:
      - label: 다른 설
        head: '‘혈마’에서'
        body: "‘끌다’의 옛말 ‘혀-’에\n‘말 마(馬)’가 붙은 ‘혈마’"
        at: 0
      - label: 반론
        head: 설마가 더 설득력
        body: "‘혈마’는 문헌에 나오지 않고\n썰매는 눈과 얼음 위를\n다니는 물건이다"
        at: 1
    say:
      - say: 한편, 끌다라는 뜻의 옛말 혀다에, 말 마 자가 붙은 혈마에서 왔다는 견해도 있습니다.
        sub: 한편, ‘끌다’라는 뜻의 옛말 ‘혀다’에, ‘말 마’ 자가 붙은 ‘혈마’에서 왔다는 견해도 있습니다.
      - 하지만 혈마라는 말은 문헌에서 찾을 수 없고, 썰매는 끄는 것뿐 아니라 눈과 얼음 위를 다니는 물건이라, 눈 설 자가 든 설마에서 왔다고 보는 쪽이 더 설득력 있다고 합니다.

  # ================================================================ 6. 뜻까지 바뀐 말
  - type: chapter
    chapter: 뜻까지 바뀐 말
    num: 6
    title: 뜻까지 바뀐 말
    icon: icon:paw_prints
    subtitle: 짐승
    say:
      - 마지막은, 소리뿐 아니라 뜻까지 바뀐 말입니다.

  - type: chain
    title: '‘짐승’의 족보'
    icon: icon:paw_prints
    steps:
      - {lang: 한자어, badge: icon:lotus, word: 衆生, reading: '중생 · 살아 있는 모든 것'}
      - {lang: 15세기, word: 쥬ᇰᄉᆡᇰ, reading: '‘동물’이라는 뜻으로도'}
      - {lang: 지금, badge: icon:paw_prints, word: 짐승, reading: 동물}
    reveal: [0, 1, 2]
    note: '원래 뜻은 ‘중생’이라는 말로 따로 남았다'
    note_at: 2.5
    say:
      - say: 짐승은, 불교에서 살아 있는 모든 존재를 이르는 중생에서 왔습니다.
        sub: 짐승은, 불교에서 살아 있는 모든 존재를 이르는 ‘중생(衆生)’에서 왔습니다.
      - 그런데 십오 세기에 이미, 이 말이 동물이라는 좁은 뜻으로도 쓰였습니다.
      - say: 그 좁은 뜻의 말이 즘생을 거쳐 짐승이 되었고, 원래의 넓은 뜻은 중생이라는 말로 따로 남았죠.
        sub: 그 좁은 뜻의 말이 ‘즘ᄉᆡᇰ’을 거쳐 짐승이 되었고, 원래의 넓은 뜻은 ‘중생’이라는 말로 따로 남았죠.

  # ================================================================ 정리
  - type: summary
