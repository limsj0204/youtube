# 단어해체소: 김치도 한자어였다 (알고 보니 한자였던 우리말)
#
# 근거 자료: research.md (국립국어원 우리말어휘역사사전 중심, 모든 항목 원문 확인)
# 원칙: 사전이 말한 것까지만. 해석은 "~로 봅니다", "~인 셈이죠"로 드러낸다.
# 옛한글(ᄒᆡᆼ, ᄎᆡ 등)은 화면(sub, 카드)에만 쓰고, 낭독(say)에는 현대 발음으로 적는다.

series: 단어해체소
title: 김치도 한자어였다
description: |
  김치, 사냥, 성냥, 배추, 그리고 짐승까지. 순우리말처럼 들리지만 알고 보면 한자에서 온 말들입니다.
  국립국어원 우리말어휘역사사전을 따라, 이 말들이 수백 년 동안 어떻게 소리가 닳고 바뀌어 지금의 모습이 되었는지 해체해 봅니다.
  김치의 '김'이 사실은 실수를 바로잡으려다 생긴 소리라는 이야기도 담았습니다.
  어원은 설이 여러 개인 경우가 많습니다. 틀린 부분이 있다면 댓글로 알려주세요.
