    say:
      - 감자와 고추. 우리 밥상에 빠지지 않는 작물이죠.
      - 그런데 옛 문헌을 보면, 감자라는 이름은 원래 고구마를, 고추라는 이름은 원래 후추를 가리켰습니다.
      - 오늘은 새 작물을 따라 이리저리 옮겨 다닌 이름들을 해체해 봅니다.

  - type: intro_shatter
    name: 단어해체소
    accent_from: 2
    hold: 2.6

  - type: title
    title: "이름이 옮겨 간\n작물들"
    subtitle: 감자, 고구마, 고추, 그리고 후추
    hold: 3.4

  # ================================================================ 1. 고구마가 먼저 왔다
  - type: chapter
    chapter: 고구마가 먼저 왔다
    num: 1
    title: 고구마가 먼저 왔다
    icon: icon:roasted_sweet_potato
    subtitle: 쓰시마에서 온 이름
    say:
      - 이야기는 고구마에서 시작합니다.

  - type: map
    title: 고구마가 건너온 바다
    view: [123, 136, 32.2, 38.2]
    view_short: [126.5, 132, 33, 37]
    highlight: [South Korea]
    routes:
      - start: 1.4
        end: 1.4
        head: icon:roasted_sweet_potato
        via: [[129.3, 34.3], [129.25, 34.75], [129.1, 35.05]]
    pins:
      - {name: 쓰시마, lon: 129.3, lat: 34.42, at: 1, dx: 170, dy: 20, caption: 부산과 규슈 사이의 섬}
    labels:
      - {text: 한반도, lon: 127.3, lat: 36.4, at: 0, size: 70}
      - {text: 규슈, lon: 130.8, lat: 32.9, at: 1, size: 56}
    say:
      - say: 고구마는 십팔 세기, 일본에 다녀온 조선통신사 조엄이 들여온 것으로 알려져 있습니다. 조선통신사는 조선이 일본에 보낸 외교 사절이죠.
        sub: 고구마는 18세기, 일본에 다녀온 조선통신사 조엄이 들여온 것으로 알려져 있습니다. 조선통신사는 조선이 일본에 보낸 외교 사절이죠.
      - 고구마는 쓰시마에서 건너왔습니다. 쓰시마는 부산과 일본 규슈 사이에 있는 섬이죠.

  - type: chain
    title: '‘고구마’의 족보'
    icon: icon:roasted_sweet_potato
    steps:
      - {lang: 쓰시마 말, word: こうこういも, reading: 고코이모}
      - {lang: 1764년 『해사일기』, word: 古貴爲麻, reading: 고귀위마}
      - {lang: 19세기, word: 고그마}
      - {lang: 20세기, word: 고구마}
    reveal: [0, 1, 3, 3.5]
    note: '‘이모’가 ‘마’로 바뀐 건 우리말 식물 이름 ‘마’의 영향으로 본다'
    note_at: 2
    say:
      - say: 이름도 쓰시마 말에서 왔습니다. 일본 표준어로는 사쓰마이모라고 하지만, 쓰시마에서는 고코이모라고 불렀거든요.
        sub: 이름도 쓰시마 말에서 왔습니다. 일본 표준어로는 ‘사쓰마이모(サツマイモ)’라고 하지만, 쓰시마에서는 ‘고코이모(こうこういも)’라고 불렀거든요.
      - say: 조엄의 일기 해사일기, 천칠백육십사 년 기록에 고귀위마라고 적힌 것이, 고구마에 대한 가장 오래된 기록입니다.
        sub: 조엄의 일기 『해사일기』, 1764년 기록에 ‘고귀위마(古貴爲麻)’라고 적힌 것이, 고구마에 대한 가장 오래된 기록입니다.
      - say: 일본어 이모에 해당하는 부분이 마로 바뀐 건, 우리말 식물 이름인 마의 영향으로 봅니다.
        sub: 일본어 ‘이모’에 해당하는 부분이 ‘마’로 바뀐 건, 우리말 식물 이름인 ‘마’의 영향으로 봅니다.
      - say: 그리고 십구 세기 고그마를 거쳐, 이십 세기에 고구마가 되었습니다.
        sub: 그리고 19세기 ‘고그마’를 거쳐, 20세기에 고구마가 되었습니다.

  - type: tableau
    title: 고구마의 옛 이름, 감저
    layers:
      - {img: 'icon:roasted_sweet_potato', x: 0.3, y: 0.44, size: 280, at: 0, motion: float}
    texts:
      - {text: '甘藷 (감저)', x: 0.66, y: 0.36, size: 96, at: 0, font: serif_bold}
      - {text: '= 고구마', x: 0.66, y: 0.52, size: 64, at: 0.3, color: accent, font: serif_bold}
      - {text: '지금 우리가 아는 ‘감자’의 옛말', x: 0.66, y: 0.68, size: 40, at: 1}
    say:
      - say: 그런데 고구마라는 이름이 자리 잡기 전에는, 고구마를 감저라고 불렀습니다.
        sub: 그런데 고구마라는 이름이 자리 잡기 전에는, 고구마를 ‘감저(甘藷)’라고 불렀습니다.
      - 바로 지금 우리가 아는 감자라는 말의 옛 모습이죠.

  # ================================================================ 2. 감자가 들어오자
  - type: chapter
    chapter: 감자가 들어오자
    num: 2
    title: 감자가 들어오자
    icon: icon:potato
    subtitle: 북쪽 감저와 남쪽 감저
    say:
      - 그러다 십구 세기, 또 하나의 작물이 들어옵니다. 바로 감자입니다.

  - type: map
    title: 북쪽에서 온 감자, 남쪽에서 온 고구마
    view: [111, 146, 32, 46]
    view_short: [123, 133, 33, 44]
    highlight: [South Korea, North Korea]
    routes:
      - start: 0
        end: 0
        overland: true
        color: accent2
        head: icon:potato
        via: [[125.4, 43.0], [127.3, 42.3], [129.0, 41.6]]
      - start: 3
        end: 3
        head: icon:roasted_sweet_potato
        via: [[129.3, 34.3], [129.25, 34.75], [129.1, 35.05]]
    pins:
      - {name: '관북 (함경도)', lon: 129.2, lat: 41.4, at: 1, dx: 210, dy: 0, color: accent2, caption: '북감저 · 감자'}
      - {name: 쓰시마, lon: 129.3, lat: 34.42, at: 3, dx: 170, dy: 20, caption: '남감저 · 고구마'}
    labels:
      - {text: 청나라, lon: 122.5, lat: 43.3, at: 0, size: 60}
    say:
      - 고구마가 남쪽 바다를 건너왔다면, 감자는 북쪽에서 들어왔습니다.
      - say: 조선 후기 학자 이규경이 쓴 백과사전 같은 책, 오주연문장전산고에는, 감자가 천팔백이십사 년에서 이십오 년 무렵, 관북, 지금의 함경도 지방에 처음 들어왔다고 적혀 있다고 합니다.
        sub: 조선 후기 학자 이규경이 쓴 백과사전 같은 책, 『오주연문장전산고』에는, 감자가 1824~1825년 무렵, 관북, 지금의 함경도 지방에 처음 들어왔다고 적혀 있다고 합니다.
      - 청나라에서 인삼을 캐러 국경을 몰래 넘어온 사람들이 심어 먹던 것이 퍼졌다는 이야기도 전해지고, 바다를 통해 들어왔다는 다른 이야기도 있습니다.
      - say: 이 새 작물은 북쪽에서 온 감저, 북감저라고 불렸고, 고구마는 남감저라고도 불렸습니다.
        sub: 이 새 작물은 북쪽에서 온 감저, ‘북감저(北甘藷)’라고 불렸고, 고구마는 ‘남감저(南甘藷)’라고도 불렸습니다.

  - type: theories
    title: 이름이 갈라지다
    cards:
      - label: 고구마
        head: 감저 → 고구마
        body: "쓰시마에서 온 이름\n‘고구마’가 자리 잡음"
        at: 0
      - label: 감자
        head: 감저 → 감자
        body: "‘감저’라는 이름은\n감자에게 남음\n(19세기 감져 → 20세기 감자)"
        at: 1
    say:
      - 결국 두 작물의 이름은 갈라졌습니다. 고구마는 쓰시마에서 온 고구마라는 이름으로 불리게 되었고,
      - 감저라는 이름은 감자에게 남아, 감저가 감자가 되었죠.
      - 그래서 표준국어대사전에는 지금도 감저가 감자의 원말이면서, 고구마를 뜻하는 말로도 함께 올라 있습니다.

  - type: theories
    title: 아직 남아 있는 흔적
    cards:
      - label: 제주도 말
        head: '감저 = 고구마'
        body: "‘지슬’ = 감자"
        at: 0
      - label: 1925년 김동인 「감자」
        head: 사실은 고구마?
        body: "작가는 복녀가 훔치는 작물을\n고구마로 생각하고 썼다고 한다"
        at: 1
      - label: 1920년 조선어 사전
        head: '감져 = 고구마'
        body: "조선총독부가 펴낸 사전에도\n고구마를 가리키는 말로 실림"
        at: 2.5
    say:
      - 지금도 제주도 말로는, 고구마를 감저, 감자를 지슬이라고 부릅니다.
      - 김동인의 소설 감자도 그렇습니다. 작가는 주인공 복녀가 훔치는 작물을, 감자가 아니라 고구마로 생각하고 썼다고 합니다.
      - 실제로 천구백이십 년, 조선총독부가 펴낸 조선어 사전에도, 감저가 고구마를 가리키는 말로 실려 있었다고 하죠.

  # ================================================================ 3. 후추의 이름을 가져간 고추
  - type: chapter
    chapter: 후추의 이름을 가져간 고추
    num: 3
    title: 후추의 이름을 가져간 고추
    icon: icon:hot_pepper
    subtitle: 고쵸는 원래 후추였다
    say:
      - 이번엔 고추입니다.

  - type: chain
    title: '‘고쵸’가 가리킨 것'
    icon: icon:hot_pepper
    steps:
      - {lang: 15세기, badge: 'custom:black_pepper', word: 고쵸, reading: '= 후추 (胡椒)'}
      - {lang: 17세기 무렵, badge: 'icon:hot_pepper', word: 고쵸, reading: '= 고추'}
      - {lang: 20세기, word: 고추}
    reveal: [0, 2, 2.6]
    note: '15세기 『구급간이방언해』: 원문 ‘胡椒(후추)’에 한글로 ‘고쵸’'
    note_at: 0.5
    say:
      - say: 십오 세기 의학책인 구급간이방언해에는, 원문의 한자 호초, 그러니까 후추에 고쵸라는 한글이 달려 있습니다.
        sub: 15세기 의학책 『구급간이방언해』에는, 원문의 한자 ‘호초(胡椒)’, 그러니까 후추에 ‘고쵸’라는 한글이 달려 있습니다.
      - 그래서 원래 고쵸는 후추를 가리키던 말로 봅니다.
      - 그런데 고추가 들어오면서, 십칠 세기 무렵부터 고쵸가 고추를 가리키게 되었습니다.
      - 이름을 내준 후추는, 호쵸라는 새 모습으로 바뀌어 적히다가, 지금의 후추가 되었다고 봅니다.

  - type: theories
    title: 고추는 언제 들어왔을까
    cards:
      - label: 널리 알려진 설
        head: 임진왜란 때 일본에서
        body: "1614년 이수광의 『지봉유설』에\n일본에서 온 ‘남만초’, ‘왜개자’"
        at: 1
      - label: 반론
        head: 거꾸로 조선에서?
        body: "일본에는 ‘고려호초(高麗胡椒)’라 하여\n임진왜란 때 조선에서 전해졌다는\n반대 기록도 있다"
        at: 2
    say:
      - 고추가 언제 들어왔는지도, 아직 논란이 있습니다.
      - say: 널리 알려진 설은 임진왜란 무렵 일본에서 들어왔다는 겁니다. 천육백십사 년, 이수광이 여러 지식을 모아 엮은 책 지봉유설에, 일본에서 왔다는 남만초, 왜개자라는 작물이 나오기 때문이죠.
        sub: 널리 알려진 설은 임진왜란 무렵 일본에서 들어왔다는 겁니다. 1614년, 이수광이 여러 지식을 모아 엮은 책 『지봉유설』에, 일본에서 왔다는 ‘남만초’, ‘왜개자’라는 작물이 나오기 때문이죠.
      - say: 하지만 일본에는 거꾸로, 고려호초라고 해서, 임진왜란 때 조선에서 전해졌다는 기록도 있습니다.
        sub: 하지만 일본에는 거꾸로, ‘고려호초(高麗胡椒)’라고 해서, 임진왜란 때 조선에서 전해졌다는 기록도 있습니다.

  - type: theories
    title: '‘고쵸’라는 이름의 뿌리'
    cards:
      - {label: 설 1, head: 원래 우리말, body: "본래부터 있던\n고유어로 보는 견해", at: 1}
      - {label: 설 2, head: '苦椒 (매운 후추)', body: "반론 · 중세 국어의 ‘苦’는\n‘쓰다’는 뜻뿐\n‘맵다’는 뜻이 없었다", at: 2}
      - {label: 설 3, head: '苦草 (매운 풀)', body: "반론 · ‘草’는 옛 발음이\n‘초’라서 ‘고쵸’가\n되기 어렵다", at: 4}
      - {label: 설 4, head: 일본어 こしょう, body: "고추와 함께 들어온\n일본어 ‘코쇼(후추)’가\n변했다는 견해", at: 6}
    say:
      - 그렇다면 고쵸라는 이름은 어디서 왔을까요? 여기에도 여러 설이 있습니다.
      - 첫째, 원래부터 있던 우리말이라는 견해입니다.
      - say: 둘째, 쓸 고 자에 산초나무 초 자를 쓴 고초, 매운 후추라는 뜻에서 왔다는 설입니다.
        sub: 둘째, ‘쓸 고(苦)’ 자에 ‘산초나무 초(椒)’ 자를 쓴 ‘고초’, ‘매운 후추’라는 뜻에서 왔다는 설입니다.
      - 하지만 중세 국어에서 쓸 고 자에는 쓰다는 뜻만 있고 맵다는 뜻은 없어서, 한자의 음만 빌려 적은 것이라는 반론이 있습니다.
      - say: 셋째, 매운 풀이라는 뜻으로 쓸 고 자에 풀 초 자를 쓴 고초라는 설입니다. 하지만 풀 초 자는 옛 발음이 초여서, 쵸로 적힌 고쵸의 뿌리가 되기는 어렵다고 합니다.
        sub: 셋째, ‘매운 풀’이라는 뜻으로 ‘쓸 고(苦)’ 자에 ‘풀 초(草)’ 자를 쓴 ‘고초’라는 설입니다. 하지만 ‘풀 초’ 자는 옛 발음이 ‘초’여서, ‘쵸’로 적힌 ‘고쵸’의 뿌리가 되기는 어렵다고 합니다.
      - say: 넷째, 일본에서 고추가 들어올 때, 후추를 뜻하는 일본어 코쇼가 함께 들어와 변했다는 견해도 있습니다.
        sub: 넷째, 일본에서 고추가 들어올 때, 후추를 뜻하는 일본어 ‘코쇼(こしょう)’가 함께 들어와 변했다는 견해도 있습니다.
      - 다만 고쵸라는 말은, 고추가 들어오기 전인 십오 세기 문헌에 이미 나온다는 점도 기억해 둘 만하죠.

  # ================================================================ 정리
  - type: summary
    chapter: 정리
    title: 오늘 해체한 이름
    rows:
      - {word: 고구마, icon: 'icon:roasted_sweet_potato', path: 'こうこういも → 고귀위마 → 고구마', at: 0}
      - {word: 감자, icon: 'icon:potato', path: '감저: 고구마 → 감자', at: 0}
      - {word: 고추, icon: 'icon:hot_pepper', path: '고쵸: 후추 → 고추', at: 0}
      - {word: 후추, icon: 'custom:black_pepper', path: '고쵸 → 호쵸 → 후추', at: 0}
