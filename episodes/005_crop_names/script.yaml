tags: [어원, 단어의유래, 감자, 고구마, 고추, 후추, 우리말, 국어, 상식]

sources:
  - 국립국어원 우리말어휘역사사전 '감자', '고구마', '고추', '후추' 항목 (kdict.korean.go.kr/history)
  - 국립국어원 표준국어대사전 '감저', '북감저', '남감저' · 우리말샘 '지슬', '감저'(제주 방언)
  - 한국민족문화대백과사전 '감자' 항목 (『오주연문장전산고』 인용)
  - 박현수, 「감자와 고구마의 거리 - 김동인의 「감자」 재독」, 『민족문학사연구』 63, 2017

