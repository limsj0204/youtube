# 단어해체소: 이름이 옮겨 간 작물들 (감자, 고구마, 고추, 후추)
#
# 근거 자료: research.md (우리말어휘역사사전·표준국어대사전·우리말샘 중심)
# 원칙: 사전이 말한 것까지만. 2차 자료(⚠️)는 "~라고 합니다", "~로 알려져 있습니다"로.
# 옛한글은 화면에만, 낭독은 현대 발음으로.

series: 단어해체소
title: 이름이 옮겨 간 작물들
description: |
  감자라는 이름은 원래 고구마를, 고추라는 이름은 원래 후추를 가리켰다는 거 알고 계셨나요?
  쓰시마에서 건너온 '고구마', 북쪽에서 들어온 '북감저', 후추의 이름을 가져간 '고추'까지.
  새 작물이 들어올 때마다 이리저리 옮겨 다닌 이름들을 해체해 봅니다.
  어원은 설이 여러 개인 경우가 많습니다. 틀린 부분이 있다면 댓글로 알려주세요.
