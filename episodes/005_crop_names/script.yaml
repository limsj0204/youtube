      - 정리해 보면, 감저라는 이름은 고구마에서 감자로, 고쵸라는 이름은 후추에서 고추로 옮겨 갔습니다.
      - 새 작물이 들어올 때마다, 이름도 함께 자리를 옮긴 셈이죠.

