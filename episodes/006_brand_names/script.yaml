      - 그런데 이 이름들은 모두, 원래 회사나 상품의 이름이었습니다.
      - 오늘은 상표가 그대로 물건 이름이 되어 버린 말들을 해체해 봅니다.

  - type: intro_shatter
    name: 단어해체소
    accent_from: 2
    hold: 2.6

  - type: title
    title: "상표가 이름이 된\n물건들"
    subtitle: 호치키스, 바리캉, 샤프, 그리고 포클레인
    hold: 3.4

  # ================================================================ 1. 호치키스
  - type: chapter
    chapter: 호치키스
    num: 1
    title: 호치키스
    icon: custom:stapler
    subtitle: 기관총 발명가가 만들었다?
    say:
      - 먼저 호치키스입니다.

  - type: theories
    title: 사전 속 두 개의 호치키스
    cards:
      - label: '① 표준국어대사전'
        head: 서류를 철하는 도구
        body: "미국의 상표명에서 나온 말\n= 스테이플러, 종이찍개"
        at: 0
      - label: '② 같은 사전, 같은 이름'
        head: 기관총의 하나
        body: "고안자인 미국의 발명가\n호치키스의 이름을 딴 것"
        at: 1
    say:
      - say: 스테이플러를 우리는 흔히 호치키스라고 부릅니다. 표준국어대사전도 미국의 상표명에서 나온 말이라고 적고 있죠.
        sub: 스테이플러를 우리는 흔히 ‘호치키스’라고 부릅니다. 표준국어대사전도 미국의 상표명에서 나온 말이라고 적고 있죠.
      - 그런데 같은 사전에는, 호치키스라는 이름의 기관총도 함께 올라 있습니다. 고안자인 미국의 발명가 호치키스의 이름을 땄다고 하죠.

  - type: chain
    title: 이름이 붙은 사연
    icon: custom:stapler
    steps:
      - {lang: 미국 회사, word: E.H. Hotchkiss, reading: E.H.호치키스사}
      - {lang: 1903년 일본, word: Hotchkiss No.1, reading: 처음 들여온 모델}
      - {lang: 일본어, word: ホッチキス, reading: 홋치키스}
    reveal: [0, 0.5, 1]
    say:
      - say: 일본에서는 천구백삼 년, 한 문구 상사가 미국에서 처음 들여온 스테이플러가, 이 에이치 호치키스라는 회사의 호치키스 넘버원이라는 모델이었다고 합니다.
        sub: 일본에서는 1903년, 한 문구 상사가 미국에서 처음 들여온 스테이플러가, ‘E.H.호치키스’라는 회사의 ‘Hotchkiss No.1’이라는 모델이었다고 합니다.
      - 그 모델 이름이 그대로, 스테이플러를 부르는 말이 된 거죠.

  - type: theories
    title: 기관총 발명가가 만들었다?
    cards:
      - label: 널리 퍼진 이야기
        head: 기관총의 호치키스
        body: "기관총을 만든 벤저민 호치키스가\n기관총 구조를 본떠\n스테이플러를 발명했다"
        at: 0
      - label: 반론
        head: 이어 주는 기록이 없다
        body: "현지 취재로도 문헌 증명 실패\n검증해 보니 직접적인 연결 없음\n(같은 지역 출신이라 친척일 가능성만)"
        at: 1
    say:
      - 그런데 기관총을 만든 벤저민 호치키스가, 기관총 구조를 본떠 스테이플러를 발명했다는 이야기도 널리 퍼져 있습니다.
      - say: 하지만 천구백팔십구 년 일본의 한 방송사가 그의 고향까지 취재했지만, 문헌으로 증명하지 못했다고 합니다.
        sub: 하지만 1989년 일본의 한 방송사가 그의 고향까지 취재했지만, 문헌으로 증명하지 못했다고 합니다.
      - 이 이야기를 검증한 한 연구자도 벤저민과 스테이플러 사이의 직접적인 연결은 찾지 못했고, 두 집안이 같은 지역 출신이라 친척이었을 가능성만 남겼습니다.
      - 사전에 같은 이름이 나란히 올라 있으니, 헷갈리기 쉬웠던 셈이죠.

  # ================================================================ 2. 바리캉
  - type: chapter
    chapter: 바리캉
    num: 2
    title: 바리캉
    icon: custom:hair_clipper
    subtitle: 날에 새겨진 이름
    say:
      - 다음은 이발소의 바리캉입니다.

  - type: tableau
    title: 날에 새겨진 이름
    layers:
      - {img: 'custom:hair_clipper', x: 0.27, y: 0.44, size: 280, at: 0, motion: float}
    texts:
      - {text: Bariquand et Marre, x: 0.71, y: 0.38, size: 62, at: 0, font: serif_bold}
      - {text: '바리캉 에 마르 제작소 (프랑스)', x: 0.71, y: 0.48, size: 38, at: 0.3, color: accent}
      - {text: '창업자 쥘 바리캉 + 샤를 마르', x: 0.71, y: 0.56, size: 34, at: 0.6, color: muted}
      - {text: '날에 새겨진 글자로 뿌리를 밝힘', x: 0.71, y: 0.72, size: 40, at: 2, font: serif_bold}
    say:
      - say: 표준국어대사전은 바리캉을 프랑스어로 적고, 제조 회사 이름에서 유래했다고 설명합니다. 창업자 쥘 바리캉의 이름이죠.
        sub: 표준국어대사전은 바리캉을 프랑스어로 적고, 제조 회사 이름에서 유래했다고 설명합니다. 창업자 ‘쥘 바리캉’의 이름이죠.
      - 그런데 일본에서는 이 이름이 어디서 왔는지 오랫동안 몰랐다고 합니다.
      - 그러다 국어학자 긴다이치 교스케가 외래어 사전을 만들며 조사하던 중, 도쿄대 정문 앞 한 이발소 주인에게서 실마리를 얻었습니다.
      - say: 이발소 주인이 이발기 날에 새겨진 글자를 보고, 프랑스의 바리캉 에 마르 제작소 제품이라는 걸 알려 줬다는 거죠.
        sub: 이발소 주인이 이발기 날에 새겨진 글자를 보고, 프랑스의 ‘바리캉 에 마르(Bariquand et Marre)’ 제작소 제품이라는 걸 알려 줬다는 거죠.

  # ================================================================ 3. 샤프
  - type: chapter
    chapter: 샤프
    num: 3
    title: 샤프
    icon: custom:mechanical_pencil
    subtitle: 전자 회사보다 먼저 있었던 이름
    say:
      - 이번엔 샤프입니다.

  - type: theories
    title: 영어로는 안 통하는 샤프펜슬
    cards:
      - {label: 일본에서 만든 영어, head: 샤프펜슬, body: "미국 영어 mechanical pencil\n영국 영어 propelling pencil", at: 0}
      - {label: '영어로 sharp pencil은?', head: 끝이 뾰족한 연필, body: "‘sharp’ = 뾰족한", at: 1}
    say:
      - say: 샤프펜슬, 줄여서 샤프는 사실 일본에서 만든 영어입니다. 영어로는 메커니컬 펜슬이라고 하죠.
        sub: 샤프펜슬, 줄여서 샤프는 사실 일본에서 만든 영어입니다. 영어로는 ‘mechanical pencil’이라고 하죠.
      - 영어로 샤프 펜슬이라고 하면, 그냥 끝이 뾰족한 연필이라는 뜻이 됩니다.

  - type: chain
    title: 연필 이름이 회사 이름으로
    icon: custom:mechanical_pencil
    steps:
      - {lang: 1915년, word: 하야카와식 연필, reading: 금속으로 만든 샤프}
      - {lang: 1916년 상표, word: Ever-Ready Sharp Pencil, reading: 에버 레디 샤프 펜슬}
      - {lang: 회사 이름, word: SHARP, reading: 전자 회사 샤프}
    reveal: [0, 1, 2]
    say:
      - say: 시작은 천구백십오 년, 하야카와 도쿠지라는 장인이 금속으로 만든 샤프였습니다.
        sub: 시작은 1915년, ‘하야카와 도쿠지’라는 장인이 금속으로 만든 샤프였습니다.
      - say: 이듬해 이 연필에, 에버 레디 샤프 펜슬이라는 상표가 붙었고, 그 뒤로 샤프펜슬이라는 말이 널리 쓰이게 되었다고 합니다.
        sub: 이듬해 이 연필에, ‘에버 레디 샤프 펜슬(Ever-Ready Sharp Pencil)’이라는 상표가 붙었고, 그 뒤로 샤프펜슬이라는 말이 널리 쓰이게 되었다고 합니다.
      - 그리고 하야카와가 세운 회사가 바로, 전자 회사 샤프입니다. 회사 이름이 이 연필 상표에서 나왔죠.
      - say: 더 거슬러 올라가면, 미국의 상표 에버샤프가 뿌리라는 이야기도 있습니다.
        sub: 더 거슬러 올라가면, 미국의 상표 ‘에버샤프(Eversharp)’가 뿌리라는 이야기도 있습니다.

  # ================================================================ 4. 회사 이름 그대로
  - type: chapter
    chapter: 회사 이름 그대로
    num: 4
    title: 회사 이름 그대로
    icon: custom:excavator
    subtitle: 포클레인과 바바리
    say:
      - 아예 회사 이름이 그대로 물건 이름이 된 경우도 있습니다.

  - type: theories
    title: 포클레인과 바바리
    cards:
      - label: 프랑스 회사 Poclain
        head: 포클레인
        body: "1927년 창업, 1951년 유압 굴착기\n한국에서도 이 회사 기계를 생산\n사전 뜻: 삽차"
        at: 0
      - label: 영국 회사 Burberry
        head: 바바리
        body: "버버리 회사의 제품 이름에서\n회사는 ‘버버리’, 옷은 ‘바바리’"
        at: 3
    say:
      - say: 굴착기를 부르는 포클레인은, 천구백이십칠 년 프랑스에서 세워진 회사 포클레인의 이름입니다.
        sub: 굴착기를 부르는 포클레인은, 1927년 프랑스에서 세워진 회사 ‘포클레인(Poclain)’의 이름입니다.
      - say: 이 회사는 천구백오십일 년에 유압 굴착기를 내놓았고, 한국을 비롯한 여러 나라에서 이 회사 기계가 만들어졌다고 합니다.
        sub: 이 회사는 1951년에 유압 굴착기를 내놓았고, 한국을 비롯한 여러 나라에서 이 회사 기계가 만들어졌다고 합니다.
      - 표준국어대사전에도 포클레인은, 땅을 파는 차, 삽차와 같은 말로 올라 있습니다.
      - say: 봄가을에 입는 바바리는, 영국 버버리 회사의 제품 이름에서 왔습니다. 회사 이름은 버버리인데, 옷은 바바리로 굳어진 거죠.
        sub: 봄가을에 입는 바바리는, 영국 버버리(Burberry) 회사의 제품 이름에서 왔습니다. 회사 이름은 버버리인데, 옷은 바바리로 굳어진 거죠.

  # ================================================================ 5. 영어에서도
  - type: chapter
    chapter: 상표를 잃어버린 이름
    num: 5
    title: 상표를 잃어버린 이름
    icon: custom:escalator
    subtitle: 에스컬레이터, 지퍼, 스카치테이프
    say:
      - 이런 일은 영어에서도 일어났습니다.

  - type: theories
    title: 에스컬레이터는 엘리베이터에서?
    cards:
      - label: 흔한 이야기
        head: escala + elevator
        body: "‘계단’과 ‘엘리베이터’를\n합친 말이다"
        at: 1
      - label: 반론
        head: 라틴어 scala에서
        body: "만든 사람의 기록: 라틴어 ‘scala’에\n앞에 ‘e’, 뒤에 ‘tor’를 붙였다\n‘elevator’에서 나온 말이 아니다"
        at: 2
    say:
      - say: 에스컬레이터는 천구백 년, 미국의 찰스 시버거가 상표로 등록한 이름이었습니다.
        sub: 에스컬레이터는 1900년, 미국의 찰스 시버거가 상표로 등록한 이름이었습니다.
      - 흔히 계단이라는 뜻의 말과 엘리베이터를 합친 말이라고들 하는데요.
      - say: 시버거 본인의 기록에 따르면, 라틴어 사전에서 계단이라는 뜻의 스칼라를 뿌리로 삼고, 앞에 이, 뒤에 토르를 붙여 만든 말입니다. 엘리베이터에서 나온 말이 아니라는 거죠.
        sub: 시버거 본인의 기록에 따르면, 라틴어 사전에서 ‘계단’이라는 뜻의 ‘scala’를 뿌리로 삼고, 앞에 ‘e’, 뒤에 ‘tor’를 붙여 만든 말입니다. 엘리베이터에서 나온 말이 아니라는 거죠.

  - type: timeline
    title: 너무 유명해서 잃어버린 상표
    events:
      - {year: '1900년', icon: 'custom:escalator', label: 'escalator 상표 등록', at: 0}
      - {year: '1923년', icon: 'custom:zipper', label: '고무장화에 붙인 zipper', at: 1}
      - {year: '1925년 무렵', icon: 'custom:tape', label: '‘Scotch’ 테이프', at: 2}
      - {year: '1950년', icon: 'custom:escalator', label: 'escalator 상표 잃음', at: 3}
    say:
      - say: 에스컬레이터 상표는 엘리베이터 회사 오티스가 가지고 있어서, 다른 회사들은 모터 계단, 전기 계단 같은 다른 이름을 써야 했다고 합니다.
        sub: 에스컬레이터 상표는 엘리베이터 회사 오티스가 가지고 있어서, 다른 회사들은 ‘모터 계단(Motorstair)’, ‘전기 계단(Electric Stairway)’ 같은 다른 이름을 써야 했다고 합니다.
      - say: 지퍼도 천구백이십삼 년, 미국의 비 에프 굿리치사가 지퍼를 단 고무장화에 붙인 이름이었습니다. 표준국어대사전도 상품명에서 나온 말이라고 적고 있죠.
        sub: 지퍼도 1923년, 미국의 B.F.굿리치사가 지퍼를 단 고무장화에 붙인 이름이었습니다. 표준국어대사전도 상품명에서 나온 말이라고 적고 있죠.
      - say: 스카치테이프의 스카치는, 당시 영어에서 인색하다는 낮춤의 뜻으로도 쓰였는데, 테이프를 시험하던 한 자동차 도장공이, 인색한 사장들한테 접착제 좀 더 바르라고 해라, 하고 투덜댄 데서 상표 이름이 나왔다는 이야기가 전해집니다.
        sub: 스카치테이프의 ‘스카치(Scotch)’는, 당시 영어에서 ‘인색하다’는 낮춤의 뜻으로도 쓰였는데, 테이프를 시험하던 한 자동차 도장공이 “인색한 사장들한테 접착제 좀 더 바르라고 해!” 하고 투덜댄 데서 상표 이름이 나왔다는 이야기가 전해집니다.
      - say: 그리고 천구백오십 년, 미국 특허청은 에스컬레이터가 이미 모두가 쓰는 말이 되었다며, 오티스의 상표 독점을 인정하지 않았습니다.
        sub: 그리고 1950년, 미국 특허청은 ‘에스컬레이터’가 이미 모두가 쓰는 말이 되었다며, 오티스의 상표 독점을 인정하지 않았습니다.

