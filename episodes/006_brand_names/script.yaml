# 단어해체소: 상표가 이름이 된 물건들 (호치키스, 바리캉, 샤프, 포클레인 …)
#
# 근거 자료: research.md (표준국어대사전 + 일본어·영어 위키백과)
# 원칙: 사전·문서가 말한 것까지만. 위키백과만 근거인 이야기는 "~라고 합니다".
# 상표 로고는 쓰지 않는다 (물건 그림은 직접 그림).

series: 단어해체소
title: 상표가 이름이 된 물건들
description: |
  호치키스, 바리캉, 샤프, 포클레인. 매일 쓰는 이 물건 이름들, 원래는 회사나 상품의 이름이었습니다.
  호치키스는 정말 기관총 발명가가 만들었을까? 바리캉의 뿌리는 어떻게 밝혀졌을까?
  에스컬레이터와 지퍼처럼, 너무 유명해져서 상표를 잃어버린 이름까지 해체해 봅니다.
  어원은 설이 여러 개인 경우가 많습니다. 틀린 부분이 있다면 댓글로 알려주세요.
