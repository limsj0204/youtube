    say:
      - say: 그리고 짜장면을 처음 판 가게로 흔히 알려진 곳이, 인천 차이나타운의 공화춘입니다.
        sub: 그리고 짜장면을 처음 판 가게로 흔히 알려진 곳이, 인천 차이나타운의 ‘공화춘(共和春)’입니다.
      - say: 산둥 출신 화교, 그러니까 외국에 자리 잡은 중국 사람 우희광이 운영하던 숙식업소에서 출발했는데, 중화민국이 세워진 걸 기념해 공화국의 봄이라는 뜻의 공화춘으로 이름을 바꿨다고 합니다.
        sub: 산둥 출신 화교, 그러니까 외국에 자리 잡은 중국 사람 우희광이 운영하던 숙식업소에서 출발했는데, 중화민국이 세워진 걸 기념해 ‘공화국의 봄’이라는 뜻의 공화춘으로 이름을 바꿨다고 합니다.
      - say: 그런데 공화춘이 문을 연 해는 자료마다 달라서, 천구백오 년이라는 자료도, 천구백십이 년이라는 자료도 있습니다. 앞의 숙식업소가 문을 연 해와 이름을 바꾼 해가 섞여 전해지는 것으로 보입니다.
        sub: 그런데 공화춘이 문을 연 해는 자료마다 달라서, 1905년이라는 자료도, 1912년이라는 자료도 있습니다. 앞의 숙식업소가 문을 연 해와 이름을 바꾼 해가 섞여 전해지는 것으로 보입니다.
      - say: 공화춘은 천구백팔십삼 년에 문을 닫았고, 그 건물은 지금 짜장면 박물관이 되었습니다.
        sub: 공화춘은 1983년에 문을 닫았고, 그 건물은 지금 짜장면 박물관이 되었습니다.

