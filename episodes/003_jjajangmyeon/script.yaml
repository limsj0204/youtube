series: 단어해체소
title: 짜장면은 왜 한때 틀린 말이었을까
description: |
  중국집 대표 메뉴 짜장면, 2011년까지는 사전에서 틀린 표기였다는 거 알고 계셨나요?
  '기름에 볶은 장'이라는 중국어에서 온 이름, 산둥에서 인천으로 건너온 한 그릇, 이름의 뿌리가 아직 밝혀지지 않은 춘장,
  그리고 '자장면'과 '짜장면'을 둘러싼 표기 논쟁까지 해체해 봅니다.
  어원은 설이 여러 개인 경우가 많습니다. 틀린 부분이 있다면 댓글로 알려주세요.
