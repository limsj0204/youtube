      - say: 그리고 천팔백구십 년대, 산둥에서 건너온 부두 노동자들이 인천항에서 춘장에 국수를 비벼 끼니를 때우던 것이, 짜장면의 시작이라고 전해집니다.
        sub: 그리고 1890년대, 산둥에서 건너온 부두 노동자들이 인천항에서 춘장에 국수를 비벼 끼니를 때우던 것이, 짜장면의 시작이라고 전해집니다.

