  # ================================================================ 3. 춘장의 이름 (정설 없음)
  - type: chapter
    chapter: 춘장은 왜 춘장일까 (정설 없음)
    num: 3
    title: 춘장은 왜 춘장일까
    icon: icon:speech_balloon
    subtitle: 이름의 뿌리가 밝혀지지 않은 장
    say:
      - 그런데 짜장면의 맛을 내는 검은 장, 춘장이라는 이름은 또 어디서 왔을까요?

  - type: theories
    title: 춘장의 이름, 세 가지 이야기
    cards:
      - label: 사전의 한자
        head: '春醬 · 봄 춘'
        body: "사전은 ‘봄 춘’으로 적지만\n왜 ‘봄’인지는 설명이 없다"
        at: 0
      - label: 설 1
        head: '‘첨장’에서'
        chain: ['甜麵醬 (첨면장)', 첨장, 춘장]
        body: "춘장의 원형이 중국의\n톈몐장이라는 점과 맞는다"
        at: 2
      - label: 설 2
        head: '‘충장’에서'
        chain: ['葱醬 (충장)', 춘장]
        body: "‘파를 찍어 먹는 장’\n옛 중국집은 파와 춘장을 냈다"
        at: 4
    stamp: {text: 정설 없음, at: 6}
    say:
      - say: 표준국어대사전은 춘장을, 봄 춘 자를 써서 적습니다.
        sub: 표준국어대사전은 춘장을, ‘봄 춘(春)’ 자를 써서 적습니다.
      - 하지만 사전에는 봄과 무슨 관계인지 설명이 없고, 실제로 춘장의 어원은 아직 확실히 밝혀지지 않았습니다.
      - say: 첫 번째 설은, 중국의 달콤한 장인 톈몐장을 우리 한자음으로 읽은 첨면장이, 첨장으로 줄었다가 춘장이 되었다는 겁니다.
        sub: 첫 번째 설은, 중국의 달콤한 장인 ‘톈몐장(甜麵醬)’을 우리 한자음으로 읽은 ‘첨면장’이, ‘첨장’으로 줄었다가 춘장이 되었다는 겁니다.
      - 실제로 춘장은 중국의 톈몐장을 한국식으로 바꾼 장이라서, 이 설과 맞는 부분이 있습니다.
      - say: 두 번째 설은, 파를 찍어 먹는 장이라는 뜻의 중국어 충장이 변했다는 겁니다.
        sub: 두 번째 설은, ‘파를 찍어 먹는 장’이라는 뜻의 중국어 ‘충장(葱醬)’이 변했다는 겁니다.
      - 산둥에서는 대파를 장에 찍어 먹었고, 예전 중국집도 파와 춘장을 함께 냈다고 합니다. 지금 중국집에서 양파와 춘장을 내주는 게, 그 파가 양파로 바뀐 모습이라고 하죠.
      - 다만 두 설 모두 확실한 근거로 정리된 건 아니어서, 춘장이라는 이름의 뿌리는 아직 정설이 없습니다.

