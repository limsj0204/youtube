    title: 자장면과 짜장면
    icon: icon:memo
    subtitle: 틀린 말이었던 짜장면
    say:
      - 이제 오늘의 진짜 이야기입니다. 짜장면은 왜 한때 틀린 표기였을까요?

  # 규칙대로면 '자장몐' → 그래서 나온 '자장면'
  - type: theories
    title: 규칙대로 적으면?
    cards:
      - label: 외래어 표기법
        head: 자장몐
        chain: [zhájiàngmiàn, 자장몐]
        body: "중국어의 ‘zh’ 소리는\n‘ㅈ’으로 적는다"
        at: 0
      - label: 국립국어연구원의 설명
        head: 자장면
        body: "중국어 ‘자장(炸醬)’에\n우리 한자어 ‘면(麵)’이 붙은 말로 보고\n‘자장면’으로 적는다"
        at: 2
    say:
      - say: 외래어를 적는 규칙인 외래어 표기법에서는, 중국어 로마자로 제트에이치라고 쓰는 소리를 지읒으로 적습니다.
        sub: 외래어를 적는 규칙인 외래어 표기법에서는, 중국어의 ‘zh’ 소리를 ‘ㅈ’으로 적습니다.
      - say: 그래서 규칙대로라면, 이 국수의 이름은 자장몐이 됩니다.
        sub: 그래서 규칙대로라면, 이 국수의 이름은 ‘자장몐’이 됩니다.
      - say: 하지만 자장몐은 실제 발음과 너무 멀었죠. 그래서 중국어 자장에 우리 한자어 면이 붙은 말로 보고, 자장면으로 적게 했다는 게, 지금의 국립국어원인 국립국어연구원의 설명입니다.
        sub: 하지만 ‘자장몐’은 실제 발음과 너무 멀었죠. 그래서 중국어 ‘자장’에 우리 한자어 ‘면’이 붙은 말로 보고, ‘자장면’으로 적게 했다는 게, 지금의 국립국어원인 국립국어연구원의 설명입니다.
      - say: 이천 년에 나온 국립국어연구원의 한 글은, 방송에서도 자장면이라고 하니, 이제 자장면이 자리를 잡아 가는 단계라고까지 적었습니다.
        sub: 2000년에 나온 국립국어연구원의 한 글은, 방송에서도 ‘자장면’이라고 하니, 이제 자장면이 자리를 잡아 가는 단계라고까지 적었습니다.

  # 사람들의 반론
  - type: theories
    title: 그래도 짜장면
    cards:
      - label: 실제 발음
        head: '210명 중 151명'
        body: "서울·경기 사람 대부분이\n‘짜장면’으로 발음\n(2002년 표준 발음 실태 조사)"
        at: 0
      - label: 시인 안도현
        head: '‘입맛이 당기지 않는다’'
        body: "짜장면을 먹자고 해야지\n자장면을 먹자고 하면\n입맛이 당기지 않는다"
        at: 1
      - label: 표기의 형평
        head: 짬뽕은 짬뽕인데?
        body: "짬뽕은 그대로 두고\n왜 짜장면만 고치느냐는 비판"
        at: 2
    say:
      - say: 하지만 사람들은 여전히 짜장면이라고 했습니다. 이천이 년 표준 발음 실태 조사에서도, 서울·경기 사람 이백십 명 가운데 백오십일 명이 짜장면으로 발음했다고 합니다.
        sub: 하지만 사람들은 여전히 짜장면이라고 했습니다. 2002년 표준 발음 실태 조사에서도, 서울·경기 사람 210명 가운데 151명이 ‘짜장면’으로 발음했다고 합니다.
      - say: 시인 안도현은, 짜장면을 먹자고 해야지, 자장면을 먹자고 하면 영 입맛이 당기지 않을 거라고 쓰기도 했죠.
        sub: 시인 안도현은, “짜장면을 먹자고 해야지, 자장면을 먹자고 하면 영 입맛이 당기지 않을 게 뻔하다”고 쓰기도 했죠.
      - 짬뽕은 짬뽕이라고 그대로 쓰면서, 왜 짜장면만 자장면으로 고치느냐는 비판도 나왔습니다.

  # 결론: 둘 다 표준어
  - type: theories
    title: 결국, 둘 다 맞는 말
    cards:
      - label: 예전부터
        head: 자장면
        body: "외래어 표기법에 따른 표기"
        at: 0
      - label: 2011년부터
        head: 짜장면
        body: "실제로 많이 쓰는 표기를\n표준어로 인정"
        at: 0.5
    stamp: {text: 둘 다 표준어, at: 1}
    say:
      - say: 결국 이천십 년 십이월, 국어심의회가 두 표기를 모두 인정하기로 했고, 이천십일 년 팔월 국립국어원이 짜장면을 표준어로 발표했습니다.
        sub: 결국 2010년 12월, 국어심의회가 두 표기를 모두 인정하기로 했고, 2011년 8월 국립국어원이 ‘짜장면’을 표준어로 발표했습니다.
      - 그래서 지금은 자장면도, 짜장면도 모두 맞는 표기입니다.
      - 자리를 잡아 간다던 자장면은, 십일 년 만에 짜장면과 자리를 나눠 쓰게 된 셈이죠.

  # ================================================================ 정리
  - type: summary
    chapter: 정리
    title: 오늘 해체한 단어
    rows:
      - {word: 이름, icon: icon:speech_balloon, path: 炸醬麵 → 짜장면, at: 0}
      - {word: 짜장, icon: icon:cooking, path: '炸(볶다) + 醬(장) = 볶은 장', at: 0}
      - {word: 한국 짜장면, icon: icon:ship, path: 산둥 → 인천, at: 0}
      - {word: 춘장, icon: icon:jar, path: '첨장? 충장? (정설 없음)', at: 0}
      - {word: 표기, icon: icon:memo, path: '자장면 → 둘 다 표준어 (2011)', at: 1}
    say:
      - 정리해 보면, 짜장면은 기름에 볶은 장이라는 중국어에서 왔고, 산둥 사람들과 함께 인천으로 건너와 달고 검은 한국 음식이 되었습니다.
      - 그리고 그 이름은 오랫동안 틀린 표기였다가, 결국 사람들이 쓰던 대로 표준어가 되었죠.

  - type: tableau
    title: 덤으로 하나 더
    layers:
      - {img: icon:books, x: 0.5, y: 0.3, size: 200, at: 0, motion: float, short: {x: 0.5, y: 0.25, size: 180}}
    texts:
      - {text: '짜장 (부사)', x: 0.5, y: 0.56, size: 96, at: 0, font: serif_bold, short: {x: 0.5, y: 0.45}}
      - {text: '과연 정말로', x: 0.5, y: 0.72, size: 56, at: 0.3, color: accent, font: serif_bold, short: {x: 0.5, y: 0.56}}
      - {text: '“그는 짜장 사실인 것처럼 이야기를 한다.”', x: 0.5, y: 0.86, size: 36, at: 0.6, color: muted,
         short: {x: 0.5, y: 0.66, size: 32}}
    say:
      - say: 덤으로 하나 더. 사전에는 짜장이라는 우리말 부사도 있는데, 뜻이 과연 정말로입니다.
        sub: 덤으로 하나 더. 사전에는 ‘짜장’이라는 우리말 부사도 있는데, 뜻이 ‘과연 정말로’입니다.
      - say: 짜장면은 짜장, 사람들이 지켜 낸 이름인 셈이죠.
        sub: 짜장면은 짜장(과연 정말로), 사람들이 지켜 낸 이름인 셈이죠.

  - type: sources
    title: 참고 자료
    sources:
      - 국립국어원 표준국어대사전 '자장면' · '짜장면' · '짜장' · '춘장'
      - 국립국어연구원 〈우리말 바로 알기〉 ‘짜짱면’, ‘짬뽕’ (2000)
      - 한국어 위키백과 '짜장면' · '공화춘' · '춘장' · 일본어 위키백과 '炸醤麺' 및 인용 문헌
      - 'Fluent Emoji (Microsoft, MIT) · Natural Earth'
    say:
      - 오늘 이야기는 여기까지입니다. 시청해 주셔서 감사합니다.

