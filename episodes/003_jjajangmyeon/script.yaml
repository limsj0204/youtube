  - type: chain
    title: '‘짜장면’이 걸어온 길'
    icon: icon:steaming_bowl
    steps:
      - {lang: 중국어, badge: icon:chopsticks, word: 炸醬麵, reading: zhájiàngmiàn}
      - {lang: 한국어, flag: kr, word: 짜장면, reading: '자장면 · 짜장면'}
    reveal: [0, 0.6]
    note: '뜻: 고기와 채소를 넣어 볶은 중국 된장에 국수를 비벼 먹는 중국요리'
    note_at: 1
    say:
      - say: 표준국어대사전은 짜장면의 원어를 중국어 자장몐으로 적고 있습니다.
        sub: 표준국어대사전은 짜장면의 원어를 중국어 ‘자장몐(炸醬麵)’으로 적고 있습니다.
      - 뜻풀이는 고기와 채소를 넣어 볶은 중국 된장에, 국수를 비벼 먹는 중국요리입니다.

  - type: tableau
    title: 炸醬麵, 한 글자씩
    layers:
      - {img: icon:cooking, x: 0.2, y: 0.36, size: 170, at: 0, motion: float, short: {x: 0.5, y: 0.12, size: 140}}
      - {img: icon:jar, x: 0.5, y: 0.36, size: 170, at: 0.4, motion: float, short: {x: 0.5, y: 0.42, size: 140}}
      - {img: icon:chopsticks, x: 0.8, y: 0.36, size: 170, at: 0.8, motion: float, short: {x: 0.5, y: 0.72, size: 140}}
    texts:
      - {text: 炸, x: 0.2, y: 0.62, size: 120, at: 0, font: serif_bold, short: {x: 0.3, y: 0.24}}
      - {text: '기름에 튀기거나 볶다', x: 0.2, y: 0.78, size: 38, at: 0, color: accent, short: {x: 0.66, y: 0.24}}
      - {text: 醬, x: 0.5, y: 0.62, size: 120, at: 0.4, font: serif_bold, short: {x: 0.3, y: 0.54}}
      - {text: '장', x: 0.5, y: 0.78, size: 38, at: 0.4, color: accent, short: {x: 0.66, y: 0.54}}
      - {text: 麵, x: 0.8, y: 0.62, size: 120, at: 0.8, font: serif_bold, short: {x: 0.3, y: 0.84}}
      - {text: '국수', x: 0.8, y: 0.78, size: 38, at: 0.8, color: accent, short: {x: 0.66, y: 0.84}}
      - {text: '‘짜장’ = 기름에 볶은 장', x: 0.5, y: 0.95, size: 48, at: 1, font: serif_bold}
    say:
      - say: 이름을 한 글자씩 뜯어보면, 자는 기름에 튀기거나 볶는다는 뜻이고, 장은 우리가 아는 그 장, 몐은 국수입니다.
        sub: 이름을 한 글자씩 뜯어보면, ‘炸(자)’는 기름에 튀기거나 볶는다는 뜻이고, ‘醬(장)’은 우리가 아는 그 장, ‘麵(몐)’은 국수입니다.
      - 그러니까 짜장은, 기름에 볶은 장이라는 뜻이죠.
      - 중국에서는 산둥이나 베이징 같은 북쪽 지방의 가정 요리로, 고기를 장에 볶아 국수 위에 얹어 먹는다고 합니다.

