  - type: theories
    title: 우리말어휘역사사전의 ‘일요일’
    cards:
      - label: 기본 정보
        head: 일본어에서 들어온 말
        body: "19세기부터 ‘일요일’,\n‘日曜日’이 나타난다"
        at: 1
      - label: '1897년 독립신문'
        head: '“칠월 ᄉᆞ일이 일요일인 고로”'
        body: "7월 4일이 일요일이라\n미국 공사관 행사를\n5일로 미룬다는 기사"
        at: 2
    say:
      - say: 한국어 위키백과에 따르면, 조선은 음력을 썼고 요일이라는 개념이 없었다고 합니다. 그러다 천팔백구십육 년 양력을 받아들이면서, 요일 이름도 일본의 것을 그대로 따랐다고 하죠.
        sub: 한국어 위키백과에 따르면, 조선은 음력을 썼고 요일이라는 개념이 없었다고 합니다. 그러다 1896년 양력을 받아들이면서, 요일 이름도 일본의 것을 그대로 따랐다고 하죠.
      - 실제로 국립국어원 우리말어휘역사사전은, 일요일을 일본어로부터 들어온 말이라고 적고 있습니다. 우리 문헌에는 십구 세기 말부터 나타나죠.
      - say: 천팔백구십칠 년 독립신문에는, 올해는 칠월 사일이 일요일이라, 미국 공사관의 기념 행사를 오일로 미룬다는 기사도 실렸습니다.
        sub: 1897년 독립신문에는, 올해는 7월 4일이 일요일이라, 미국 공사관의 기념 행사를 5일로 미룬다는 기사도 실렸습니다.

  - type: theories
    title: 일요일과 토요일의 다른 이름
    cards:
      - label: '공일(空日)'
        head: 일을 하지 않고 쉬는 날
        body: "“독립 협회에셔ᄂᆞᆫ 공일마다\n연셜들을 ᄒᆞ여 가며” (1898)"
        at: 0
      - label: '반공일(半空日)'
        head: 반만 쉬는 날 = 토요일
        body: "오전만 일하고 오후에 쉬는 날\n“공일 젼 반공일노 모혀셔” (1898)"
        at: 2
      - label: '주일(主日)'
        head: 기독교의 일요일
        body: "예수가 부활한 날이\n일요일이었다는 데서"
        at: 4
    say:
      - say: 요일 이름이 들어온 뒤에도, 우리말로 된 다른 이름이 함께 쓰였습니다. 쉬는 날이라는 뜻의 공일이 일요일을 가리켰죠.
        sub: 요일 이름이 들어온 뒤에도, 우리말로 된 다른 이름이 함께 쓰였습니다. 쉬는 날이라는 뜻의 ‘공일(空日)’이 일요일을 가리켰죠.
      - 천팔백구십팔 년 신문에는, 독립 협회에서는 공일마다 연설을 한다는 기사가 나옵니다.
      - say: 그리고 토요일은 반공일이라고 했습니다. 오전만 일하고 오후에는 쉬니, 반만 공일이라는 거죠.
        sub: 그리고 토요일은 ‘반공일(半空日)’이라고 했습니다. 오전만 일하고 오후에는 쉬니, 반만 공일이라는 거죠.
      - 공일 전날 반공일에 모여 토론하기로 했다는 기사도 남아 있습니다.
      - say: 교회에서는 일요일을 주일이라고 불렀습니다. 예수가 부활한 날이 일요일이었다는 데서 온 말입니다.
        sub: 교회에서는 일요일을 ‘주일(主日)’이라고 불렀습니다. 예수가 부활한 날이 일요일이었다는 데서 온 말입니다.

  - type: chain
    title: '덤: 일곱 날을 세는 우리말'
    icon: icon:spiral_calendar
    steps:
      - {lang: 15세기, word: 닐웨}
      - {lang: 17세기, word: 닐에}
      - {lang: 20세기, word: 이레}
    reveal: [0, 1, 1.5]
    note: '1447년 『석보상절』: “열반ᄒᆞ샨 디 닐웨 디나샤” (열반하신 지 이레 지나서)'
    note_at: 0.5
    say:
      - say: 덤으로 하나 더. 일곱 날을 세는 말은 원래 우리말에도 있었습니다. 바로 이레죠. 십오 세기 석보상절에는 닐웨로 나옵니다.
        sub: 덤으로 하나 더. 일곱 날을 세는 말은 원래 우리말에도 있었습니다. 바로 ‘이레’죠. 15세기 『석보상절』에는 ‘닐웨’로 나옵니다.
      - say: 닐웨가 닐에를 거쳐, 첫소리 니은이 떨어지면서 지금의 이레가 되었습니다.
        sub: ‘닐웨’가 ‘닐에’를 거쳐, 첫소리 ㄴ이 떨어지면서 지금의 ‘이레’가 되었습니다.

