        at: 0
      - label: 쓰임새
        head: 쉬는 날이 아니라 점치는 날
        body: "그날의 길흉을 따지는 데 쓰였고\n에도 시대 일상생활에서는\n쓰이지 않았다고 한다"
        at: 2
    say:
      - say: 일본 헤이안 시대의 달력에는, 일요일을 밀, 빽빽할 밀 자로 적기도 했다고 합니다. 소그드 말로 해의 날을 뜻하는 미르를, 한자 소리로 옮겨 적은 것이라고 하죠.
        sub: 일본 헤이안 시대의 달력에는, 일요일을 ‘밀(密)’ 자로 적기도 했다고 합니다. 소그드 말로 해의 날을 뜻하는 ‘미르(Myr)’를, 한자 소리로 옮겨 적은 것이라고 하죠.
      - 소그드는 사마르칸트 일대, 중앙아시아 땅의 이름입니다.
      - 하지만 이때의 요일은 쉬는 날을 정하는 게 아니라, 그날의 좋고 나쁨을 점치는 데 쓰였다고 합니다.

