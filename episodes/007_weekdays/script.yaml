fact_check:
  - 요일 순서의 두 설명(행성 시간, 테트라코드)은 카시우스 디오의 기록 (위키백과 기준)
  - 당나라 전래(8세기, 마니교도·강국 경유, 불공), 일본 전래(구카이, 후지와라노 미치나가 일기), 메이지 1876년 일요일 휴무는 위키백과 기준
  - 조선에 요일 개념이 없었고 1896년 양력 도입과 함께 일본식 요일 이름을 따랐다는 것은 한국어 위키백과 기준 (일요일이 일본어에서 왔다는 것은 우리말어휘역사사전 ✅)
  - 중국이 지금 星期一~星期六 숫자로 부르는 것은 위키백과 기준

