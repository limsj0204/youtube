# 단어해체소: 월화수목금토일 (요일 이름에 숨은 일곱 천체)
#
# 근거 자료: research.md
#   ✅ 표준국어대사전(칠요·칠정·오성·오행·세성·진성·태백성·칠정산), 우리말어휘역사사전(일요일·공일·반공일·주일·이레)
#   ⚠️ 위키백과(영어 'Names of the days of the week'·'Planetary hours', 일본어 '曜日', 한국어 '요일')
# 원칙: 사전이 말한 것까지만 단정. 위키백과에서 온 역사 이야기는 "~다고 합니다", "~로 알려져 있습니다".

series: 단어해체소
title: 월화수목금토일, 이름에 숨은 일곱 별
description: |
  월, 화, 수, 목, 금, 토, 일. 매일 쓰는 요일 이름에는 하늘의 일곱 천체가 숨어 있습니다.
  왜 하필 이 순서일까요? 그리고 우리는 언제부터 이 이름을 썼을까요?
  로마에서 비단길을 지나 당나라와 일본, 그리고 우리말에 닿기까지, 요일 이름의 긴 여행을 해체해 봅니다.
  틀린 부분이 있다면 댓글로 알려주세요.
