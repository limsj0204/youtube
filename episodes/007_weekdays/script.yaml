      - 매일 쓰는 요일 이름에는, 사실 하늘의 일곱 천체가 숨어 있습니다.
      - 그런데 왜 하필 이 순서일까요? 그리고 우리는 언제부터 이 이름을 썼을까요?
      - 오늘은 요일 이름의 긴 여행을 해체해 봅니다.

  - type: intro_shatter
    name: 단어해체소
    accent_from: 2
    hold: 2.6

  - type: title
    title: "월화수목금토일\n이름에 숨은 일곱 별"
    subtitle: 요일 이름의 긴 여행
    hold: 3.4

  # ================================================================ 1. 하늘의 일곱 천체
  - type: chapter
    chapter: 하늘의 일곱 천체
    num: 1
    title: 하늘의 일곱 천체
    icon: icon:night_with_stars
    subtitle: 칠요, 또는 칠정
    say:
      - 먼저 요일 이름이 무엇을 가리키는지부터 보겠습니다.

  - type: theories
    title: '칠요(七曜) = 칠정(七政)'
    cards:
      - label: 표준국어대사전
        head: 해 · 달 · 다섯 행성
        body: "태양, 달, 화성, 수성,\n목성, 금성, 토성을\n통틀어 이르는 말"
        at: 0
      - label: 다섯 행성 = 오성(五星)
        head: 화 · 수 · 목 · 금 · 토
        body: "오행(五行)의 다섯 글자와\n같은 이름"
        at: 2
    say:
      - say: 표준국어대사전에는 칠요, 또는 칠정이라는 말이 있습니다. 태양, 달, 화성, 수성, 목성, 금성, 토성을 통틀어 이르는 말이죠.
        sub: 표준국어대사전에는 ‘칠요(七曜)’, 또는 ‘칠정(七政)’이라는 말이 있습니다. 태양, 달, 화성, 수성, 목성, 금성, 토성을 통틀어 이르는 말이죠.
      - 맨눈으로 보이면서, 별자리 사이를 움직여 다니는 일곱 천체입니다.
      - say: 이 가운데 다섯 행성의 이름, 화, 수, 목, 금, 토는, 세상을 이루는 다섯 원소라는 오행의 글자와 같습니다.
        sub: 이 가운데 다섯 행성의 이름, 화·수·목·금·토는, 세상을 이루는 다섯 원소라는 ‘오행(五行)’의 글자와 같습니다.
      - 그래서 요일 이름을 우리말로 풀면, 달, 불, 물, 나무, 쇠, 흙, 해가 되는 거죠.

  - type: tableau
    title: 행성의 옛 이름
    layers:
      - {img: 'icon:telescope', x: 0.2, y: 0.45, size: 260, at: 0, motion: float}
    texts:
      - {text: '목성 = 세성(歲星)', x: 0.62, y: 0.3, size: 64, at: 0, font: serif_bold}
      - {text: '수성 = 진성(辰星)', x: 0.62, y: 0.45, size: 64, at: 0, font: serif_bold}
      - {text: '저녁의 금성 = 태백성(太白星)', x: 0.62, y: 0.6, size: 64, at: 0, font: serif_bold}
      - {text: '세종 때 역서 『칠정산』: 일곱 천체의 움직임을 계산', x: 0.62, y: 0.78, size: 38, at: 1, color: accent}
    say:
      - say: 옛날에는 행성을 다른 이름으로도 불렀습니다. 목성은 세성, 수성은 진성, 저녁 하늘의 금성은 태백성이라고 했죠.
        sub: 옛날에는 행성을 다른 이름으로도 불렀습니다. 목성은 ‘세성(歲星)’, 수성은 ‘진성(辰星)’, 저녁 하늘의 금성은 ‘태백성(太白星)’이라고 했죠.
      - say: 조선 세종 때 펴낸 역서, 칠정산의 칠정도, 바로 이 일곱 천체를 가리킵니다.
        sub: 조선 세종 때 펴낸 역서 『칠정산(七政算)』의 ‘칠정’도, 바로 이 일곱 천체를 가리킵니다.

  # ================================================================ 2. 왜 이 순서일까
  - type: chapter
    chapter: 왜 이 순서일까
    num: 2
    title: 왜 이 순서일까
    icon: icon:mantelpiece_clock
    subtitle: 행성이 시간을 맡는다면
    say:
      - 그렇다면 요일은 왜, 해, 달, 화, 수, 목, 금, 토라는 순서가 되었을까요?

  - type: chain
    title: 옛사람들이 본 하늘의 순서
    icon: icon:ringed_planet
    steps:
      - {lang: 가장 느림, word: 토}
      - {lang: '', word: 목}
      - {lang: '', word: 화}
      - {lang: '', word: 해}
      - {lang: '', word: 금}
      - {lang: '', word: 수}
      - {lang: 가장 빠름, word: 달}
    reveal: [1, 1, 1, 1, 1, 1, 1]
    note: '하늘에서 느리게 움직이는 것부터: 토성 → 목성 → 화성 → 해 → 금성 → 수성 → 달'
    note_at: 1
    say:
      - 고대 그리스와 로마의 천문학에서는, 이 일곱 천체를 지구에서 먼 것부터 차례로 늘어놓았습니다.
      - 밤하늘에서 느리게 움직이는 것부터, 토성, 목성, 화성, 해, 금성, 수성, 달의 순서죠.
      - 그런데 요일 순서는 이것과 다릅니다. 이 차이를 설명하는 이야기가 로마 시대 기록에 남아 있습니다.

  - type: theories
    title: '설 1: 행성 시간'
    cards:
      - label: 카시우스 디오가 적은 설명
        head: 일곱 천체가 한 시간씩
        body: "하루 24시간을 위 순서대로\n한 시간씩 돌아가며 맡고\n첫 시간을 맡은 천체가\n그날의 이름이 된다"
        at: 1
    say:
      - 로마의 역사가 카시우스 디오는, 요일 순서에 대해 두 가지 설명을 함께 적었다고 합니다.
      - 더 잘 알려진 것은 행성 시간이라는 설명입니다. 일곱 천체가 하루 이십사 시간을, 방금 본 순서대로 한 시간씩 돌아가며 맡고, 첫 시간을 맡은 천체가 그날의 이름이 된다는 거죠.

  - type: chain
    title: 세 칸씩 건너뛰면
    icon: icon:mantelpiece_clock
    steps:
      - {lang: 첫 시간, word: 토, reading: 토요일}
      - {lang: 25시간째, word: 해, reading: 일요일}
      - {lang: 49시간째, word: 달, reading: 월요일}
      - {lang: 그다음, word: 화, reading: 화요일}
      - {lang: 그다음, word: 수, reading: 수요일}
      - {lang: 그다음, word: 목, reading: 목요일}
      - {lang: 그다음, word: 금, reading: 금요일}
    reveal: [0, 1, 2, 2.4, 2.6, 2.8, 3]
    say:
      - 첫 시간을 토성이 맡으면, 그날은 토요일입니다.
      - 이십사 시간을 돌고 나면, 다음 날 첫 시간은 순서에서 세 칸 뒤에 있는 해가 맡습니다. 그래서 토요일 다음은 일요일이죠.
      - 다시 세 칸 뒤의 달이 맡으니 월요일, 그다음은 화성, 수성, 목성, 금성.
      - 이렇게 지금의 요일 순서가 그대로 나옵니다.
      - say: 이 설명은 이 세기 무렵 점성술사 베티우스 발렌스의 책에도 나온다고 합니다.
        sub: 이 설명은 2세기 무렵 점성술사 베티우스 발렌스의 책에도 나온다고 합니다.

  - type: theories
    title: 반론, 그리고 또 하나의 설명
    cards:
      - label: '설 1에 대한 반론'
        head: 로마 시대의 추측
        body: "요일의 기원은 그때 이미\n잊힐 만큼 오래되어, 실제로\n이렇게 정해졌는지는 모른다"
        at: 0
      - label: 설 2 · 테트라코드
        head: 음악의 음정 원리
        body: "같은 순서를 음악의\n4도 음정 원리로 풀이"
        at: 1
    say:
      - 하지만 이 설명은 로마 시대 사람들의 추측일 뿐, 요일의 기원은 그때 이미 잊힐 만큼 오래되어, 실제로 이렇게 순서가 정해졌는지는 알 수 없다는 반론이 있습니다.
      - 디오가 적은 또 하나의 설명은, 같은 순서를 음악의 음정 원리, 이른바 테트라코드로 풀이하는 것입니다.

  # ================================================================ 3. 서양 요일 속 같은 별
  - type: chapter
    chapter: 서양 요일 속 같은 별
    num: 3
    title: 서양 요일 속 같은 별
    icon: icon:classical_building
    subtitle: 화요일과 Tuesday는 같은 날
    say:
      - 이 이름들은 서양 요일에도 그대로 남아 있습니다.

  - type: tableau
    title: 로마에서 시작된 일곱 요일
    layers:
      - {img: 'icon:classical_building', x: 0.24, y: 0.45, size: 280, at: 0, motion: float}
    texts:
      - {text: '1~3세기 로마', x: 0.64, y: 0.3, size: 72, at: 0, font: serif_bold}
      - {text: '8일 주기 → 7일 주기', x: 0.64, y: 0.45, size: 56, at: 0, color: accent, font: serif_bold}
      - {text: '폼페이 낙서: 서기 60년 2월 6일 = ‘해의 날’', x: 0.64, y: 0.6, size: 38, at: 1}
    say:
      - 로마 제국은 일 세기에서 삼 세기 사이, 여드레마다 돌아오던 장날 주기를, 점차 이레 주기로 바꿨다고 합니다.
      - say: 가장 오래된 증거로는, 폼페이에 남은 낙서가 꼽힙니다. 서기 육십 년 이월 육일을, 해의 날이라고 적어 두었다고 하죠.
        sub: 가장 오래된 증거로는, 폼페이에 남은 낙서가 꼽힙니다. 서기 60년 2월 6일을 ‘해의 날(dies Solis)’이라고 적어 두었다고 하죠.

  - type: summary
    title: 화요일과 Tuesday는 같은 별
    rows:
      - {word: 화요일, icon: 'icon:fire', path: 'Tuesday (티우) · mardi ← 화성(마르스)', at: 0}
      - {word: 수요일, icon: 'icon:droplet', path: 'Wednesday (워든) · mercredi ← 수성(메르쿠리우스)', at: 1}
      - {word: 목요일, icon: 'icon:deciduous_tree', path: 'Thursday (토르) · jeudi ← 목성(유피테르)', at: 2}
      - {word: 금요일, icon: 'icon:coin', path: 'Friday (프리그) · vendredi ← 금성(베누스)', at: 3}
      - {word: 토요일, icon: 'icon:rock', path: 'Saturday ← 토성(사투르누스)', at: 4}
    say:
      - say: 프랑스어 화요일 마르디는, 로마 신 마르스, 곧 화성의 날입니다. 영어 튜즈데이는, 마르스와 짝을 이루는 게르만의 신 티우의 날이고요.
        sub: 프랑스어 화요일 ‘마르디(mardi)’는, 로마 신 마르스, 곧 화성의 날입니다. 영어 ‘튜즈데이(Tuesday)’는, 마르스와 짝을 이루는 게르만의 신 티우의 날이고요.
      - say: 수요일 웬즈데이는 메르쿠리우스, 곧 수성과 짝을 이루는 워든의 날,
        sub: 수요일 ‘웬즈데이(Wednesday)’는 메르쿠리우스, 곧 수성과 짝을 이루는 워든의 날,
      - say: 목요일 서즈데이는 유피테르, 곧 목성과 짝을 이루는 천둥의 신 토르의 날,
        sub: 목요일 ‘서즈데이(Thursday)’는 유피테르, 곧 목성과 짝을 이루는 천둥의 신 토르의 날,
      - say: 금요일 프라이데이는 베누스, 곧 금성과 짝을 이루는 여신 프리그의 날입니다.
        sub: 금요일 ‘프라이데이(Friday)’는 베누스, 곧 금성과 짝을 이루는 여신 프리그의 날입니다.
      - say: 그리고 토요일 새터데이는, 토성인 사투르누스의 이름을 그대로 간직하고 있죠.
        sub: 그리고 토요일 ‘새터데이(Saturday)’는, 토성인 사투르누스의 이름을 그대로 간직하고 있죠.
      - 우리가 화요일이라고 부르는 날과 서양의 튜즈데이는, 결국 같은 별의 날인 셈입니다.

