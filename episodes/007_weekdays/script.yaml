      - say: 천팔백칠십육 년, 관청이 일요일에 쉬기 시작하면서, 요일이 일본 사람들의 생활 속에 자리 잡았다고 합니다.
        sub: 1876년, 관청이 일요일에 쉬기 시작하면서, 요일이 일본 사람들의 생활 속에 자리 잡았다고 합니다.
      - say: 한편 중국은 지금, 일요일을 뺀 나머지 요일을 숫자로 부릅니다. 월요일은 싱치이, 요일 일, 화요일은 싱치얼, 요일 이 하는 식이죠.
        sub: 한편 중국은 지금, 일요일을 뺀 나머지 요일을 숫자로 부릅니다. 월요일은 ‘星期一(요일 1)’, 화요일은 ‘星期二(요일 2)’ 하는 식이죠.

  # ================================================================ 5. 우리말 속 요일
  - type: chapter
