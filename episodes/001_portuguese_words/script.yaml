# 단어의 여행 1화: 포르투갈에서 온 단어들
#
# say: 음성으로 읽을 문장 (숫자·로마자는 한글로 풀어 쓰기)
#   - 문자열 하나면 자막도 같은 글
#   - {say: 읽을 글, sub: 자막 글} 로 따로 지정 가능
# 각 장면의 at/reveal/start/end 값은 "몇 번째 문장(0부터)"에서 등장할지를 뜻한다.
#
# ⚠️ 사실 확인 필요: 아래 대본은 초안이다. 업로드 전에 sources 의 자료로
#    문장 하나하나를 직접 확인할 것. (fact_check 항목 참고)

series: 단어의 여행
title: 포르투갈에서 온 단어들
description: |
  매일 먹는 '빵', 사실 포르투갈어에서 왔다는 거 알고 계셨나요?
  16세기 포르투갈 상인들의 바닷길을 따라 일본을 거쳐 한국까지 건너온 단어들을 따라가 봅니다.
  어원은 설이 여러 개인 경우가 많습니다. 영상에서는 사전과 연구 자료에 근거한 내용만 다루고,
  정설이 없는 경우에는 그렇다고 밝힙니다. 틀린 부분이 있다면 댓글로 알려주세요.
speed: 0.95   # 말하기 속도 (1.0 = 기본)
tags: [어원, 단어의유래, 외래어, 포르투갈어, 빵, 카스텔라, 상식]

sources:
  - 국립국어원 표준국어대사전 '빵', '카스텔라', '담배' 항목 (stdict.korean.go.kr)
  - 국립국어원 우리말샘 '담바고' 항목 (opendict.korean.go.kr)
  - 포르투갈인의 일본 도래(1543)와 남만무역 관련 개설서
  - Online Etymology Dictionary 등 일본어 외래어 어원 자료

fact_check:   # 업로드 전 확인 목록
  - 표준국어대사전에 '빵 ← pão(포르투갈어)'로 실려 있는지
  - 카스텔라 어원 'pão de Castela' 설의 근거와 표현 수위 ("가장 널리 알려진 설")
  - ‘담바고’, ‘담바귀’ 표기가 실린 옛 문헌·민요 출처
  - 포르투갈인 일본 도래 연도(1543 또는 1542) 표기
  - 일본에서 포르투갈인을 '남만인(南蛮人)'이라 부른 것, 배에 선교사가 함께 탄 것
  - 총, 유리 제품이 포르투갈 교역으로 들어온 것
  - 카스티야가 포르투갈과 국경을 맞댄 왕국이었던 것
  - 담배가 아메리카 원산이고 유럽인을 통해 퍼진 것

thumbnail:
  big: 빵
  lines: ['포르투갈어?', 일본을 거쳐 온 단어들]
  badge: 단어의 여행
  flags: [pt, jp, kr]
  map_view: [-25, 150, -45, 55]
  highlight: [Portugal, Japan, South Korea]

scenes:
  - type: hook
    word: 빵
    icon: icon:bread
    icon_at: 0.3
    strike: ['한국어?', '영어?']
    strike_at: 1
    reveal: 포르투갈어!
    reveal_at: 2
    say:
      - 매일 먹는 빵.
      - 그런데 이 빵이라는 말, 사실 한국어도 영어도 아니라는 거 알고 계셨나요?
      - 오늘은 포르투갈에서 출발해 일본을 거쳐, 한국까지 건너온 단어들의 긴 여행을 따라가 보겠습니다.

  - type: title
    kicker: 단어의 여행 · 제1화
    title: 포르투갈에서 온 단어들
    subtitle: 빵 · 카스텔라 · 담배
    flags: [pt, jp, kr]
    ship: custom:carrack
    hold: 5.5

  # ---------------------------------------------------------------- 1. 빵
  - type: chapter
    chapter: 빵
    num: 1
    title: 빵
    icon: icon:bread
    subtitle: 포르투갈어에서 일본어로, 다시 한국어로
    say:
      - 첫 번째 단어, 빵입니다.

  - type: chain
    title: '‘빵’이 걸어온 길'
    icon: icon:bread
    steps:
      - {lang: 포르투갈어, flag: pt, word: pão, reading: 빠웅}
      - {lang: 일본어, flag: jp, word: パン, reading: 팡}
      - {lang: 한국어, flag: kr, word: 빵, reading: 빵}
    reveal: [0, 1, 2]
    say:
      - say: 사전에서 빵을 찾아보면, 포르투갈어 빠웅에서 온 말이라고 나옵니다.
        sub: 사전에서 '빵'을 찾아보면, 포르투갈어 pão에서 온 말이라고 나옵니다.
      - say: 이 말이 일본에 들어가 팡이 되었고,
        sub: 이 말이 일본에 들어가 '팡(パン)'이 되었고,
      - 다시 한국으로 건너와 지금의 빵이 된 것으로 봅니다.

  # 16세기 항로: 지금의 국기 대신 아이콘 (당시 고아·믈라카·마카오는 포르투갈 거점)
  - type: map
    title: 포르투갈의 바닷길
    view: [-25, 150, -52, 48]
    view_short: [-20, 145, -40, 50]
    highlight: [Portugal, Japan]
    routes:
      - start: 1
        end: 3
        head: custom:carrack
        via: [[-9.1, 38.7], [-11, 36], [-18, 22], [-19.5, 13], [-12, 3], [5, -20], [18.5, -36.5],
              [32, -33], [41, -18], [44, -2], [58, 10], [70, 14.8], [73.2, 15.4], [73.7, 13],
              [74.7, 10.5], [76.1, 7.4], [80.5, 5.3], [88, 5.5], [94.8, 6.6], [98, 5.2],
              [100.4, 3.3], [101.9, 2.0], [103.8, 1.15], [105.6, 2.6], [109.6, 9], [112.4, 18],
              [113.6, 21.8], [116.5, 22.3], [119.6, 24.2], [122.6, 28], [126, 31], [129.5, 32.6],
              [129.9, 32.8]]
    pins:
      - {name: 리스본, icon: icon:anchor, lon: -9.1, lat: 38.7, at: 0.3, dx: 120, dy: 10}
      - {name: 희망봉, icon: icon:compass, lon: 18.5, lat: -34.4, at: 1.6, dx: 160, dy: -90}
      - {name: 고아, icon: icon:package, lon: 73.8, lat: 15.5, at: 2.2, dx: -30, dy: -60}
      - {name: 믈라카, icon: icon:package, lon: 102.2, lat: 2.2, at: 2.5, dx: -60, dy: 60}
      - {name: 마카오, icon: icon:package, lon: 113.5, lat: 22.2, at: 2.8, dx: -110, dy: -40}
      - {name: 나가사키, icon: icon:japanese_castle, lon: 129.9, lat: 32.8, at: 3.6, dx: -40, dy: -70, size: 46}
    say:
      - 그렇다면 포르투갈의 말이 어떻게 일본까지 갔을까요?
      - say: 십오 세기 말, 포르투갈은 아프리카 남쪽 끝을 돌아 인도로 가는 바닷길을 열었습니다.
        sub: 15세기 말, 포르투갈은 아프리카 남쪽 끝을 돌아 인도로 가는 바닷길을 열었습니다.
      - 이후 인도의 고아, 말레이반도의 믈라카, 중국의 마카오를 거점 삼아 동쪽으로 나아갔죠.
      - say: 그리고 십육 세기 중반, 마침내 일본에 닿습니다.
        sub: 그리고 16세기 중반, 마침내 일본에 닿습니다.

  - type: tableau
    title: 남쪽 바다에서 온 사람들
    layers:
      - {img: custom:carrack, x: 0.3, y: 0.55, size: 380, at: 0, motion: slide, from: [-0.15, 0.58], until: 0,
         short: {x: 0.5, y: 0.3, size: 330, from: [-0.3, 0.3]}}
      - {img: icon:japanese_castle, x: 0.78, y: 0.5, size: 260, at: 0.5,
         short: {x: 0.75, y: 0.62, size: 220}}
      - {img: icon:latin_cross, x: 0.56, y: 0.22, size: 100, at: 1, motion: float,
         short: {x: 0.25, y: 0.62}}
      - {img: icon:church, x: 0.64, y: 0.3, size: 130, at: 1.2, motion: float,
         short: {x: 0.4, y: 0.7}}
      - {img: icon:package, x: 0.55, y: 0.62, size: 130, at: 2, motion: float, tilt: -15,
         short: {x: 0.28, y: 0.9}}
      - {img: icon:bread, x: 0.66, y: 0.7, size: 130, at: 2.3, motion: float, tilt: 15,
         short: {x: 0.5, y: 0.92}}
    texts:
      - {text: '남만인(南蛮人)', x: 0.3, y: 0.95, size: 54, at: 0.3, color: accent, font: serif_bold,
         short: {x: 0.5, y: 0.08}}
      - {text: '총 · 유리 · 빵', x: 0.61, y: 0.86, size: 44, at: 2.3,
         short: {x: 0.78, y: 0.92}}
    say:
      - say: 일본 사람들은 남쪽 바다에서 배를 타고 온 이 서양인들을 남만인이라고 불렀습니다.
        sub: 일본 사람들은 남쪽 바다에서 배를 타고 온 이 서양인들을 '남만인(南蛮人)'이라고 불렀습니다.
      - 배에는 상인뿐 아니라, 크리스트교를 전하려는 선교사들도 타고 있었죠.
      - 그리고 이들과 함께 총과 유리 제품, 빵처럼 일본 사람들이 처음 보는 물건과 음식이 들어왔습니다.

  - type: timeline
    title: 포르투갈과 일본의 약 백 년
    events:
      - {year: '1543', icon: custom:carrack, label: '포르투갈인, 다네가시마에 처음 도착', at: 0}
      - {year: '1549', icon: icon:latin_cross, label: 선교사 하비에르 일본 도착, at: 1}
      - {year: '1571', icon: icon:anchor, label: '나가사키, 포르투갈 무역항으로', at: 1.5}
      - {year: '1639', icon: icon:no_entry, label: 포르투갈 배의 입항 금지, at: 2}
    say:
      - say: 흔히 천오백사십삼 년, 다네가시마에 표류한 배에 타고 있던 포르투갈인을 첫 만남으로 봅니다.
        sub: 흔히 1543년, 다네가시마에 표류한 배에 타고 있던 포르투갈인을 첫 만남으로 봅니다.
      - 이후 선교사와 상인들이 드나들었고, 나가사키는 포르투갈 무역의 중심 항구가 됩니다.
      - say: 천육백삼십구 년 포르투갈 배의 입항이 금지될 때까지, 약 백 년 가까이 교류가 이어졌죠.
        sub: 1639년 포르투갈 배의 입항이 금지될 때까지, 약 100년 가까이 교류가 이어졌죠.
      - 이 시기에 빵을 비롯한 여러 포르투갈어 단어가 일본어에 자리 잡았습니다.

  # 근대 이야기라 지금의 국기를 써도 시대가 맞는다
  - type: map
    title: 일본에서 한국으로
    view: [118, 146, 26, 44]
    view_short: [122, 142, 28, 42]
    highlight: [Japan, South Korea]
    routes:
      - start: 0
        end: 1
        color: accent2
        dashed: true
        head: icon:bread
        via: [[130.4, 33.6], [129.7, 34.4], [129.04, 35.1]]
    pins:
      - {name: 'パン', icon: flag:jp, lon: 130.4, lat: 33.6, at: 0, dx: 110, dy: 50, color: accent}
      - {name: '빵', icon: flag:kr, lon: 129.04, lat: 35.1, at: 1, dx: -150, dy: 20, color: accent2}
    say:
      - 한국에서 빵이라는 말이 널리 쓰이게 된 것은 근대 이후입니다.
      - 서양식 빵과 함께, 일본어를 거쳐 들어온 것으로 봅니다.

  # ---------------------------------------------------------------- 2. 카스텔라
  - type: chapter
    chapter: 카스텔라
    num: 2
    title: 카스텔라
    icon: custom:castella
    subtitle: '‘카스티야의 빵’'
    say:
      - 두 번째 단어는 카스텔라입니다.

  - type: chain
    title: '‘카스텔라’가 걸어온 길'
    icon: custom:castella
    steps:
      - {lang: 포르투갈어, flag: pt, word: pão de Castela, reading: 카스티야의 빵}
      - {lang: 일본어, flag: jp, word: カステラ, reading: 카스테라}
      - {lang: 한국어, flag: kr, word: 카스텔라, reading: 카스텔라}
    reveal: [0, 1, 1.5]
    note: 가장 널리 알려진 설
    note_at: 0.5
    say:
      - 카스텔라의 어원으로 가장 널리 알려진 설명은, 포르투갈어로 카스티야 지방의 빵을 뜻하는 말에서 왔다는 것입니다.
      - 이 말이 일본에서는 카스테라, 한국에서는 카스텔라가 되었죠.

  - type: map
    title: 카스티야는 어디?
    view: [-13, 7, 34.5, 45.5]
    view_short: [-11, 4, 35, 45]
    highlight: [Portugal]
    pins:
      - {name: 포르투갈, lon: -8.2, lat: 39.6, at: 0, dx: 0, dy: -70}
      - {name: 카스티야, icon: custom:castella, lon: -3.9, lat: 40.6, at: 0.3, dx: 40, dy: -130,
         color: accent2, caption: 지금의 스페인 중부}
    say:
      - 카스티야는 지금의 스페인 중부 지역을 가리키는 이름입니다.
      - 당시에는 포르투갈과 국경을 맞댄 이웃 왕국이었죠.

  - type: tableau
    title: 카스텔라의 도시, 나가사키
    layers:
      - {img: custom:castella, x: 0.42, y: 0.5, size: 420, at: 0, motion: zoom,
         short: {x: 0.5, y: 0.42, size: 460}}
      - {img: icon:anchor, x: 0.72, y: 0.34, size: 140, at: 0.5, motion: float,
         short: {x: 0.2, y: 0.12}}
      - {img: icon:japanese_castle, x: 0.8, y: 0.62, size: 180, at: 0.6, motion: float,
         short: {x: 0.8, y: 0.12}}
      - {img: icon:sparkles, x: 0.27, y: 0.28, size: 100, at: 1, motion: float,
         short: {x: 0.2, y: 0.75}}
    texts:
      - {text: 나가사키 카스텔라, x: 0.42, y: 0.92, size: 52, at: 0.3, color: accent, font: serif_bold,
         short: {x: 0.5, y: 0.9}}
    say:
      - 일본 나가사키는 지금도 카스텔라로 유명한데, 바로 포르투갈 무역의 중심이었던 곳입니다.
      - 카스텔라는 이후 일본에서 오랜 시간을 거치며 지금의 모습으로 자리 잡았습니다.

  # ---------------------------------------------------------------- 3. 담배
  - type: chapter
    chapter: 담배
    num: 3
    title: 담배
    icon: icon:leaf_fluttering_in_wind
    subtitle: '‘담바고’를 아시나요'
    say:
      - 세 번째 단어는 조금 의외일 수 있습니다. 바로 담배입니다.

  - type: tableau
    title: 담배는 어디서 왔을까
    layers:
      - {img: icon:herb, x: 0.15, y: 0.5, size: 220, at: 0, motion: float, short: {x: 0.5, y: 0.13, size: 180}}
      - {img: custom:carrack, x: 0.5, y: 0.5, size: 240, at: 1, motion: float, short: {x: 0.5, y: 0.48, size: 200}}
      - {img: icon:leaf_fluttering_in_wind, x: 0.85, y: 0.5, size: 220, at: 1.5, motion: float,
         short: {x: 0.5, y: 0.83, size: 180}}
    texts:
      - {text: 아메리카, x: 0.15, y: 0.85, size: 50, at: 0, color: accent, font: serif_bold, short: {x: 0.5, y: 0.28}}
      - {text: 유럽의 배, x: 0.5, y: 0.85, size: 50, at: 1, color: accent, font: serif_bold, short: {x: 0.5, y: 0.63}}
      - {text: 아시아, x: 0.85, y: 0.85, size: 50, at: 1.5, color: accent, font: serif_bold, short: {x: 0.5, y: 0.98}}
    say:
      - 담배는 원래 아메리카 대륙의 식물입니다.
      - 유럽 사람들의 배를 타고 세계 곳곳으로 퍼졌고, 아시아에도 이 길을 따라 들어왔습니다.

  - type: chain
    title: '‘담배’가 걸어온 길'
    icon: icon:leaf_fluttering_in_wind
    steps:
      - {lang: 포르투갈어, flag: pt, word: tabaco, reading: 따바꾸}
      - {lang: 일본어, flag: jp, word: タバコ, reading: 타바코}
      - {lang: 옛 한국어, badge: icon:scroll, word: 담바고, reading: 담바귀}
      - {lang: 한국어, flag: kr, word: 담배, reading: 담배}
    reveal: [0, 0.6, 1, 2]
    say:
      - say: 담배라는 말 역시 포르투갈어 따바꾸가 일본어 타바코를 거쳐 들어온 것으로 설명됩니다.
        sub: 담배라는 말 역시 포르투갈어 tabaco가 일본어 '타바코(タバコ)'를 거쳐 들어온 것으로 설명됩니다.
      - 옛 기록과 민요에는 담바고, 담바귀 같은 형태가 남아 있는데,
      - 이 말이 점점 줄어들어 지금의 담배가 되었다고 봅니다.

  # ---------------------------------------------------------------- 정리
  - type: summary
    chapter: 정리
    title: 오늘의 단어들
    rows:
