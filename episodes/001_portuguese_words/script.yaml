# 단어언박싱: 포르투갈에서 온 단어들
#
# say: 음성으로 읽을 문장 (숫자·로마자는 한글로 풀어 쓰기)
#   - 문자열 하나면 자막도 같은 글
#   - {say: 읽을 글, sub: 자막 글} 로 따로 지정 가능
# 각 장면의 at/reveal/start/end 값은 "몇 번째 문장(0부터)"에서 등장할지를 뜻한다.
#
# 근거 자료: research.md (원문 주소와 확인 여부 정리)
# 원칙: 가장 유력한 설은 근거와 함께 길게, 다른 설도 충분히 소개한다.

series: 단어언박싱
title: 포르투갈에서 온 단어들
description: |
  매일 먹는 '빵', 사실 포르투갈어에서 왔다는 거 알고 계셨나요?
  16세기 포르투갈 상인들의 배를 타고 일본을 거쳐 한국까지 건너온 단어들을 따라가 봅니다.
  어원은 설이 여러 개인 경우가 많습니다. 영상에서는 가장 유력한 설을 중심으로, 다른 설들도 함께 소개합니다.
  틀린 부분이 있다면 댓글로 알려주세요.
theme: magazine_dark
voice:                      # 내레이션 목소리 (ElevenLabs, 한국어 여성 'Danbi - Clear & Calm')
  engine: elevenlabs
  name: CYbONFCmQ856BE6N5Cqt
  model: eleven_multilingual_v2
voice_fx: soft              # 목소리 보정 (날카로움 줄이기)
speed: 0.95   # 말하기 속도 (1.0 = 기본)
tags: [어원, 단어의유래, 외래어, 포르투갈어, 빵, 카스텔라, 담배, 상식]

sources:
  - 국립국어원 표준국어대사전 '빵', '카스텔라', '담배' 항목 (stdict.korean.go.kr)
  - 국립국어원 우리말샘 '담바고 타령' 항목 (opendict.korean.go.kr)
  - 일본어 위키백과 'カステラ', 'タバコ', 'パン', '南蛮貿易', '鉄砲伝来' 항목과 그 인용 문헌
  - "ホセ・ゴロチャテギ「ビスコチョの歴史」『カステラ文化誌全書』 (일본어 위키백과 재인용)"

credits:
  - 일러스트 Fluent Emoji (Microsoft, MIT 라이선스)
  - 국기 Wikimedia Commons (퍼블릭 도메인)
  - 지도 Natural Earth (퍼블릭 도메인)
  - 글꼴 Pretendard (SIL OFL)
  - 내레이션 ElevenLabs

fact_check:   # 업로드 전 확인 목록 (research.md 참고)
  - 위키백과로만 확인한 내용(카스텔라 옛 문헌 기록, tabaco 기원 두 설)은 가능하면 원 문헌으로 한 번 더 확인
  - ‘담바고 → 담배’로 줄어들었다는 설명은 사전 근거를 아직 못 찾음 (영상에서는 ‘흔히 ~로 설명’ 정도로만)

thumbnail:
  big: 빵
  lines: ['포르투갈어?', 일본을 거쳐 온 단어들]
  badge: 단어언박싱
  flags: [pt, jp, kr]
  map_view: [-25, 150, -45, 55]
  highlight: [Portugal, Japan, South Korea]

scenes:
  - type: hook
    word: 빵
    icon: icon:bread
    icon_at: 0.3
    strike: ['우리말?', '영어?']
    strike_at: 1
    reveal: 포르투갈어!
    reveal_at: 2
    say:
      - 매일 먹는 빵.
      - 그런데 이 빵이라는 말, 원래 우리말도 영어도 아니라는 거 알고 계셨나요?
      - 오늘은 포르투갈에서 출발해 일본을 거쳐, 한국까지 건너온 단어들의 긴 여행을 따라가 보겠습니다.

  # 채널 인트로 (내레이션 없이 효과음만)
  - type: intro
    name: 단어언박싱
    accent_from: 2
    hold: 3.0

  - type: title
    title: 포르투갈에서 온 단어들
    subtitle: 빵 · 카스텔라 · 담배
    flags: [pt, jp, kr]
    ship: custom:carrack
    hold: 3.4

  # ================================================================ 1. 빵
  - type: chapter
    chapter: 빵
    num: 1
    title: 빵
    icon: icon:bread
    subtitle: 포르투갈어에서 일본어로, 다시 한국어로
    say:
      - 첫 번째 단어, 빵입니다.

  - type: chain
    title: '‘빵’이 걸어온 길'
    icon: icon:bread
    steps:
      - {lang: 포르투갈어, flag: pt, word: pão, reading: 빠웅}
      - {lang: 일본어, flag: jp, word: パン, reading: 팡}
      - {lang: 한국어, flag: kr, word: 빵, reading: 빵}
    reveal: [0, 1, 2]
    note: '※ 영어로는 bread'
    note_at: 3
    say:
      - say: 표준국어대사전에서 빵을 찾아보면, 어원이 포르투갈어 빠웅으로 적혀 있습니다.
        sub: 표준국어대사전에서 '빵'을 찾아보면, 어원이 포르투갈어 '빠웅(pão)'으로 적혀 있습니다.
      - say: 이 말이 일본에 들어가 팡이 되었고,
        sub: 이 말이 일본에 들어가 '팡(パン)'이 되었고,
      - 다시 한국으로 건너와 지금의 빵이 된 것으로 봅니다.
      - 일본에서는 팡을 영어로 오해하는 경우도 있다고 하는데, 영어로 빵은 브레드죠.

  - type: tableau
    title: 같은 뿌리, 다른 소리
    layers:
      - {img: flag:pt, x: 0.14, y: 0.36, size: 150, at: 1, short: {x: 0.25, y: 0.3}}
      - {img: flag:es, x: 0.38, y: 0.36, size: 150, at: 1.3, short: {x: 0.75, y: 0.3}}
      - {img: flag:fr, x: 0.62, y: 0.36, size: 150, at: 1.6, short: {x: 0.25, y: 0.66}}
      - {img: flag:it, x: 0.86, y: 0.36, size: 150, at: 1.9, short: {x: 0.75, y: 0.66}}
    texts:
      - {text: 'panis · 라틴어 ‘빵, 음식’', x: 0.5, y: 0.05, size: 56, at: 0, color: accent, font: serif_bold,
         short: {x: 0.5, y: 0.06, size: 48}}
      - {text: pão, x: 0.14, y: 0.62, size: 72, at: 1, font: serif_bold, short: {x: 0.25, y: 0.46}}
      - {text: pan, x: 0.38, y: 0.62, size: 72, at: 1.3, font: serif_bold, short: {x: 0.75, y: 0.46}}
      - {text: pain, x: 0.62, y: 0.62, size: 72, at: 1.6, font: serif_bold, short: {x: 0.25, y: 0.82}}
      - {text: pane, x: 0.86, y: 0.62, size: 72, at: 1.9, font: serif_bold, short: {x: 0.75, y: 0.82}}
      - {text: 포르투갈어 · 빠웅, x: 0.14, y: 0.76, size: 34, at: 1, color: muted, short: {x: 0.25, y: 0.55}}
      - {text: 스페인어 · 빤, x: 0.38, y: 0.76, size: 34, at: 1.3, color: muted, short: {x: 0.75, y: 0.55}}
      - {text: 프랑스어 · 뺑, x: 0.62, y: 0.76, size: 34, at: 1.6, color: muted, short: {x: 0.25, y: 0.91}}
      - {text: 이탈리아어 · 빠네, x: 0.86, y: 0.76, size: 34, at: 1.9, color: muted, short: {x: 0.75, y: 0.91}}
      - {text: '↑ 이 말이 바닷길을 따라 일본으로', x: 0.14, y: 0.92, size: 36, at: 3, color: accent,
         short: {x: 0.5, y: 0.99}}
    say:
      - say: 포르투갈어를 비롯해 스페인어, 프랑스어, 이탈리아어에서 빵을 뜻하는 말은, 모두 라틴어 빠니스라는 같은 뿌리에서 나왔습니다.
        sub: 포르투갈어를 비롯해 스페인어, 프랑스어, 이탈리아어에서 빵을 뜻하는 말은, 모두 라틴어 '빠니스(panis)'라는 같은 뿌리에서 나왔습니다.
      - 포르투갈어 빠웅, 스페인어 빤, 프랑스어 뺑, 이탈리아어 빠네.
      - 소리는 조금씩 달라도, 같은 말에서 갈라져 나온 형제 단어인 셈이죠.
      - 이 형제 단어들 가운데 일본까지 직접 건너간 것은, 바닷길을 따라온 포르투갈어였습니다.

  # 16세기 항로: 지금의 국기 대신 아이콘 (당시 고아·믈라카·마카오는 포르투갈 거점)
  - type: map
    title: 포르투갈의 바닷길
    view: [-25, 150, -52, 48]
    view_short: [-20, 145, -40, 50]
    highlight: [Portugal, Japan]
    routes:
      - start: 1
        end: 3
        head: custom:carrack
        via: [[-9.1, 38.7], [-11, 36], [-18, 22], [-19.5, 13], [-12, 3], [5, -20], [18.5, -36.5],
              [32, -33], [41, -18], [44, -2], [58, 10], [70, 14.8], [73.2, 15.4], [73.7, 13],
              [74.7, 10.5], [76.1, 7.4], [80.5, 5.3], [88, 5.5], [94.8, 6.6], [98, 5.2],
              [100.4, 3.3], [101.9, 2.0], [103.8, 1.15], [105.6, 2.6], [109.6, 9], [112.4, 18],
              [113.6, 21.8], [116.5, 22.3], [119.6, 24.2], [122.6, 28], [126, 31], [129.5, 32.6],
              [129.9, 32.8]]
    pins:
      - {name: 리스본, icon: icon:anchor, lon: -9.1, lat: 38.7, at: 0.3, dx: 120, dy: 10}
      - {name: 희망봉, icon: icon:compass, lon: 18.5, lat: -34.4, at: 1.6, dx: 160, dy: -90}
      - {name: 고아, icon: icon:package, lon: 73.8, lat: 15.5, at: 2.2, dx: -30, dy: -60}
      - {name: 믈라카, icon: icon:package, lon: 102.2, lat: 2.2, at: 2.5, dx: -60, dy: 60}
      - {name: 마카오, icon: icon:package, lon: 113.5, lat: 22.2, at: 2.8, dx: -110, dy: -40}
      - {name: 나가사키, icon: icon:japanese_castle, lon: 129.9, lat: 32.8, at: 3.6, dx: -40, dy: -70, size: 46}
    say:
      - 그렇다면 포르투갈의 말이 어떻게 일본까지 갔을까요?
      - say: 십오 세기 말, 포르투갈은 아프리카 남쪽 끝을 돌아 인도로 가는 바닷길을 열었습니다.
        sub: 15세기 말, 포르투갈은 아프리카 남쪽 끝을 돌아 인도로 가는 바닷길을 열었습니다.
      - 이후 인도의 고아, 말레이반도의 믈라카, 중국의 마카오를 거점 삼아 동쪽으로 나아갔죠.
      - say: 그리고 십육 세기 중반, 마침내 일본에 닿습니다.
        sub: 그리고 16세기 중반, 마침내 일본에 닿습니다.

  - type: tableau
    title: 남쪽 바다에서 온 사람들
    layers:
      - {img: custom:carrack, x: 0.22, y: 0.5, size: 360, at: 0, motion: slide, from: [-0.15, 0.52], until: 0,
         short: {x: 0.5, y: 0.25, size: 320, from: [-0.3, 0.25]}}
      - {img: icon:japanese_castle, x: 0.86, y: 0.42, size: 230, at: 0.5, short: {x: 0.8, y: 0.55, size: 200}}
      - {img: icon:latin_cross, x: 0.45, y: 0.2, size: 100, at: 1, motion: float, short: {x: 0.2, y: 0.55}}
      - {img: icon:church, x: 0.58, y: 0.22, size: 120, at: 1.2, motion: float, short: {x: 0.42, y: 0.55}}
      - {img: icon:ear_of_corn, x: 0.42, y: 0.58, size: 110, at: 2, motion: float, tilt: -15, short: {x: 0.15, y: 0.8}}
      - {img: icon:watermelon, x: 0.54, y: 0.62, size: 110, at: 2.15, motion: float, tilt: 15, short: {x: 0.35, y: 0.8}}
      - {img: icon:globe_with_meridians, x: 0.66, y: 0.58, size: 110, at: 2.3, motion: float, short: {x: 0.55, y: 0.8}}
      - {img: icon:glasses, x: 0.78, y: 0.7, size: 110, at: 2.45, motion: float, tilt: -10, short: {x: 0.75, y: 0.8}}
      - {img: icon:bread, x: 0.5, y: 0.8, size: 100, at: 2.6, motion: float, tilt: 10, short: {x: 0.25, y: 0.95}}
      - {img: custom:castella, x: 0.62, y: 0.82, size: 100, at: 2.7, motion: float, short: {x: 0.5, y: 0.95}}
      - {img: icon:leaf_fluttering_in_wind, x: 0.74, y: 0.88, size: 90, at: 2.8, motion: float, short: {x: 0.75, y: 0.95}}
    texts:
      - {text: '남만인(南蛮人)', x: 0.22, y: 0.82, size: 54, at: 0.3, color: accent, font: serif_bold,
         short: {x: 0.5, y: 0.05}}
    say:
      - say: 일본 사람들은 남쪽 바다에서 배를 타고 온 이 서양인들을 남만인이라고 불렀습니다.
        sub: 일본 사람들은 남쪽 바다에서 배를 타고 온 이 서양인들을 '남만인(南蛮人)'이라고 불렀습니다.
      - 포르투갈 상인들은 처음부터 가톨릭 예수회 선교사들과 손을 잡고 함께 움직였죠.
      - 이들을 통해 총은 물론, 호박과 수박, 옥수수 같은 작물, 지구의와 안경,
      - 그리고 오늘의 주인공인 빵과 카스텔라, 담배까지 일본에 들어왔습니다.

  - type: timeline
    title: 포르투갈과 일본의 약 백 년
    events:
      - {year: '1543', icon: custom:carrack, label: '포르투갈인, 다네가시마에 표류', at: 0}
      - {year: '1549', icon: icon:latin_cross, label: 선교사 하비에르 일본 도착, at: 2}
      - {year: '1570', icon: icon:anchor, label: '나가사키 항, 포르투갈에 개항', at: 2.5}
      - {year: '1639', icon: icon:no_entry, label: 포르투갈 배의 입항 금지, at: 3}
    say:
      - say: 흔히 천오백사십삼 년, 다네가시마에 표류한 중국 배에 타고 있던 포르투갈인을 첫 만남으로 봅니다.
        sub: 흔히 1543년, 다네가시마에 표류한 중국 배에 타고 있던 포르투갈인을 첫 만남으로 봅니다.
      - say: 다만 기록마다 연도가 조금씩 달라서, 천오백사십일 년부터 사십사 년까지 엇갈립니다.
        sub: 다만 기록마다 연도가 조금씩 달라서, 1541년부터 1544년까지 엇갈립니다.
      - 이후 선교사와 상인들이 드나들었고, 나가사키는 포르투갈 무역의 중심 항구가 됩니다.
      - say: 천육백삼십구 년 포르투갈 배의 입항이 금지될 때까지, 백 년 가까이 교류가 이어졌죠.
        sub: 1639년 포르투갈 배의 입항이 금지될 때까지, 100년 가까이 교류가 이어졌죠.
      - 이 시기에 빵을 비롯한 여러 포르투갈어 단어가 일본어에 자리 잡았습니다.

  # 근대 이야기라 지금의 국기를 써도 시대가 맞는다
  - type: map
    title: 일본에서 한국으로
    view: [118, 146, 26, 44]
    view_short: [122, 142, 28, 42]
    highlight: [Japan, South Korea]
    routes:
      - start: 0
        end: 1
        color: accent2
        dashed: true
        head: icon:bread
        via: [[130.4, 33.6], [129.7, 34.4], [129.04, 35.1]]
    pins:
      - {name: 'パン', icon: flag:jp, lon: 130.4, lat: 33.6, at: 0, dx: 110, dy: 50, color: accent}
      - {name: '빵', icon: flag:kr, lon: 129.04, lat: 35.1, at: 1, dx: -150, dy: 20, color: accent2}
    say:
      - 한국에서 빵이라는 말이 널리 쓰이게 된 것은 근대 이후입니다.
      - 서양식 빵과 함께, 일본어를 거쳐 들어온 것으로 봅니다.

  # ================================================================ 2. 카스텔라
  - type: chapter
    chapter: 카스텔라
    num: 2
    title: 카스텔라
    icon: custom:castella
    subtitle: '‘카스티야 왕국의 과자’'
    say:
      - 두 번째 단어는 카스텔라입니다.

  - type: chain
    title: '‘카스텔라’가 걸어온 길'
    icon: custom:castella
    steps:
      - {lang: 포르투갈어, flag: pt, word: Castela, reading: ‘카스티야’라는 뜻}
      - {lang: 일본어, flag: jp, word: カステラ, reading: 카스테라}
      - {lang: 한국어, flag: kr, word: 카스텔라, reading: 카스텔라}
    reveal: [0, 2, 2.4]
    note: '유력한 설 · bolo de Castela (카스티야 왕국의 과자)'
    note_at: 1
    say:
      - 카스텔라의 어원으로 가장 유력한 설은, 스페인의 카스티야 왕국을 포르투갈 사람들이 부르던 이름, 카스텔라에서 왔다는 것입니다.
      - say: 정확히는 카스티야 왕국의 과자라는 뜻의 볼루 드 카스텔라가 줄어든 말로 봅니다.
        sub: 정확히는 '카스티야 왕국의 과자'라는 뜻의 '볼루 드 카스텔라(bolo de Castela)'가 줄어든 말로 봅니다.
      - say: 표준국어대사전도 카스텔라의 원어를 포르투갈어 카스텔라로 적고 있죠.
        sub: 표준국어대사전도 카스텔라의 원어를 포르투갈어 'castela'로 적고 있죠.

  - type: map
    title: 카스티야는 어디?
    view: [-13, 7, 34.5, 45.5]
    view_short: [-11, 4, 35, 45]
    highlight: [Portugal]
    pins:
      - {name: 포르투갈, lon: -8.2, lat: 39.6, at: 0, dx: 0, dy: -70}
      - {name: 카스티야, icon: custom:castella, lon: -3.9, lat: 40.6, at: 0.3, dx: 40, dy: -130,
         color: accent2, caption: 지금의 스페인 중부}
    say:
      - 카스티야는 지금의 스페인 중부에 있던 왕국입니다.
      - 포르투갈과는 국경을 두고 여러 번 다툰, 바로 옆 나라였죠.

  - type: tableau
    title: 옛 기록 속의 카스텔라
    layers:
      - {img: icon:scroll, x: 0.2, y: 0.26, size: 190, at: 0, motion: float, short: {x: 0.5, y: 0.14, size: 170}}
      - {img: icon:scroll, x: 0.2, y: 0.62, size: 190, at: 1, motion: float, short: {x: 0.5, y: 0.6, size: 170}}
    texts:
      - {text: '1600년 무렵 『남만요리서(南蛮料理書)』', x: 0.6, y: 0.18, size: 44, at: 0, color: muted,
         short: {x: 0.5, y: 0.3, size: 40}}
      - {text: '「かすてほう路」 · 가스테보로', x: 0.6, y: 0.32, size: 64, at: 0.3, color: accent, font: serif_bold,
         short: {x: 0.5, y: 0.4, size: 56}}
      - {text: '1704년 『나가사키 명물심고(長崎名物尋考)』', x: 0.6, y: 0.54, size: 44, at: 1, color: muted,
         short: {x: 0.5, y: 0.76, size: 38}}
      - {text: '본래 이름은 ‘카스토루보루’', x: 0.6, y: 0.68, size: 64, at: 1.3, color: accent, font: serif_bold,
         short: {x: 0.5, y: 0.86, size: 54}}
      - {text: 'Castela + bolo(과자)', x: 0.6, y: 0.86, size: 46, at: 2, short: {x: 0.5, y: 0.98, size: 44}}
    say:
      - 천육백 년 무렵 쓰인 것으로 보이는 일본의 요리책 남만요리서에는, 카스텔라 만드는 법이 가스테보로라는 이름으로 실려 있습니다.
      - 또 천칠백사 년에 나온 한 책에는, 카스테이라라는 과자의 본래 이름은 카스토루보루라고 적혀 있다고 하죠.
      - 두 기록 모두, 카스텔라와 과자를 뜻하는 볼루가 붙어 쓰이던 흔적으로 볼 수 있습니다.

  - type: theories
    title: '또 다른 설: ‘성처럼 높게’'
    cards:
      - label: 유력한 설
        head: 카스티야의 과자
        chain: [bolo de Castela, カステイラ, カステラ]
        body: "옛 일본 문헌에 남은\n이름과도 이어진다"
        at: 0
      - label: 다른 설
        head: '성(castelo)'
        body: "머랭을 칠 때\n‘성처럼 높아져라’라고\n외치던 데서 왔다는 이야기"
        at: 1
      - label: 반론
        head: 시기가 맞지 않는다
        body: "머랭 거품 내는 방법은\n카스텔라가 일본에\n전해진 뒤에 퍼졌다"
        at: 2
    say:
      - 한편, 전혀 다른 이야기도 전해집니다.
      - say: 스페인이나 포르투갈에서 달걀흰자를 거품 낼 때, 성처럼 높아져라 하고 외치던 말에서 왔다는 설입니다. 포르투갈어로 성은 까스뗄루거든요.
        sub: 스페인이나 포르투갈에서 달걀흰자를 거품 낼 때 '성처럼 높아져라' 하고 외치던 말에서 왔다는 설입니다. 포르투갈어로 성은 '까스뗄루(castelo)'거든요.
      - 하지만 달걀흰자를 머랭처럼 거품 내는 방법은 카스텔라가 일본에 전해진 뒤에야 퍼졌기 때문에, 이 설은 어원으로 보기 어렵다는 반론이 있습니다.
      - 어느 쪽이든, 포르투갈어에서 온 말이라는 점은 같습니다.

  - type: tableau
    title: 카스텔라의 도시, 나가사키
    layers:
      - {img: custom:castella, x: 0.42, y: 0.5, size: 420, at: 0, motion: zoom,
         short: {x: 0.5, y: 0.42, size: 460}}
      - {img: icon:anchor, x: 0.72, y: 0.34, size: 140, at: 0.5, motion: float,
         short: {x: 0.2, y: 0.12}}
      - {img: icon:japanese_castle, x: 0.8, y: 0.62, size: 180, at: 0.6, motion: float,
         short: {x: 0.8, y: 0.12}}
      - {img: icon:egg, x: 0.2, y: 0.62, size: 110, at: 1, motion: float,
         short: {x: 0.2, y: 0.75}}
    texts:
      - {text: 나가사키 카스텔라, x: 0.42, y: 0.92, size: 52, at: 0.3, color: accent, font: serif_bold,
         short: {x: 0.5, y: 0.9}}
    say:
      - 일본 나가사키는 지금도 카스텔라로 유명한데, 바로 포르투갈 무역의 중심이었던 곳입니다.
      - 참고로 에도 시대의 카스텔라는 달걀과 밀가루, 설탕을 같은 양씩 넣어 만들어서, 지금보다 덜 달고 덜 부푼 모습이었다고 합니다.

  # ================================================================ 3. 담배
  - type: chapter
    chapter: 담배
    num: 3
    title: 담배
    icon: icon:leaf_fluttering_in_wind
    subtitle: '‘담바고’를 아시나요'
    say:
      - 세 번째 단어는 조금 의외일 수 있습니다. 바로 담배입니다.

  - type: tableau
    title: 담배는 어디서 왔을까
    layers:
      - {img: icon:herb, x: 0.15, y: 0.5, size: 220, at: 0, motion: float, short: {x: 0.5, y: 0.13, size: 180}}
      - {img: custom:carrack, x: 0.5, y: 0.5, size: 240, at: 1, motion: float, short: {x: 0.5, y: 0.48, size: 200}}
      - {img: icon:leaf_fluttering_in_wind, x: 0.85, y: 0.5, size: 220, at: 1.5, motion: float,
         short: {x: 0.5, y: 0.83, size: 180}}
    texts:
      - {text: 남아메리카, x: 0.15, y: 0.85, size: 50, at: 0, color: accent, font: serif_bold, short: {x: 0.5, y: 0.28}}
      - {text: 유럽의 배, x: 0.5, y: 0.85, size: 50, at: 1, color: accent, font: serif_bold, short: {x: 0.5, y: 0.63}}
      - {text: 아시아, x: 0.85, y: 0.85, size: 50, at: 1.5, color: accent, font: serif_bold, short: {x: 0.5, y: 0.98}}
    say:
      - 담배는 원래 남아메리카가 원산지인 식물입니다.
      - 유럽 사람들의 배를 타고 세계 곳곳으로 퍼졌고, 아시아에도 이 길을 따라 들어왔습니다.

  - type: chain
    title: '‘담배’가 걸어온 길'
    icon: icon:leaf_fluttering_in_wind
    steps:
      - {lang: 포르투갈어 · 스페인어, word: tabaco, reading: 따바꼬}
      - {lang: 일본어, flag: jp, word: タバコ, reading: 타바코}
      - {lang: 옛 한국어, badge: icon:scroll, word: 담바고, reading: ‘담바귀’로도}
      - {lang: 한국어, flag: kr, word: 담배, reading: 담배}
    reveal: [0, 1, 2, 3]
    say:
      - say: 일본어 타바코는 스페인어나 포르투갈어의 따바꼬에서 온 말입니다. 두 언어의 철자가 같아서, 어느 쪽인지 딱 잘라 말하기는 어렵습니다.
        sub: 일본어 '타바코(タバコ)'는 스페인어나 포르투갈어의 '따바꼬(tabaco)'에서 온 말입니다. 두 언어의 철자가 같아서, 어느 쪽인지 딱 잘라 말하기는 어렵습니다.
      - 표준국어대사전은 담배의 어원을, 포르투갈어와 스페인어를 거친 일본어 타바코로 적고 있습니다.
      - say: 조선 시대 민요 담바귀 타령은 담바고 타령이라고도 불리는데, 바로 담배를 노래한 곡입니다.
        sub: 조선 시대 민요 '담바귀 타령'은 '담바고 타령'이라고도 불리는데, 바로 담배를 노래한 곡입니다.
      - say: 흔히 이 담바고가 점점 줄어들어 지금의 담배가 되었다고 설명합니다.
        sub: 흔히 이 '담바고'가 점점 줄어들어 지금의 '담배'가 되었다고 설명합니다.

  - type: theories
    title: '‘tabaco’는 어디서 왔을까'
    cards:
      - label: 전통적인 설
        head: 카리브해 원주민의 말
        chain: [타이노어 등, tabaco]
        body: "담뱃잎이나 담뱃대를\n가리키던 말을 빌려 왔다"
        at: 1
      - label: 다른 설
        head: 아랍어 약초 이름
        chain: [ṭabbāq (아랍어), tabaco]
        body: "대항해 시대 전인 1410년 무렵\n이미 스페인·이탈리아에서 쓰였다"
        at: 2
    stamp: {text: 정설 없음, at: 3}
    say:
      - say: 그렇다면 따바꼬라는 말은 어디서 왔을까요.
        sub: 그렇다면 tabaco라는 말은 어디서 왔을까요.
      - 전통적인 설은, 카리브해 원주민의 말에서 담뱃잎이나 담뱃대를 가리키던 단어를 빌려 왔다는 것입니다.
      - say: 그런데 이 단어가 대항해 시대 이전인 천사백십 년 무렵부터 이미 스페인과 이탈리아에서 쓰였다는 이야기도 있어서, 약초를 뜻하는 아랍어에서 왔다는 설도 있습니다.
        sub: 그런데 이 단어가 대항해 시대 이전인 1410년 무렵부터 이미 스페인과 이탈리아에서 쓰였다는 이야기도 있어서, 약초를 뜻하는 아랍어에서 왔다는 설도 있습니다.
      - say: 따바꼬 자체의 뿌리는 아직 확실하지 않지만, 이 말을 일본에 전한 것은 이베리아반도 사람들의 배였습니다.
        sub: tabaco 자체의 뿌리는 아직 확실하지 않지만, 이 말을 일본에 전한 것은 이베리아반도 사람들의 배였습니다.

