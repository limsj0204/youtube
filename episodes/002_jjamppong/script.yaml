# 단어해체소: 짬뽕은 어디서 왔을까
#
# 근거 자료: research.md (원문 주소와 확인 여부 정리)
# 원칙: 가장 유력한 설은 근거와 함께 길게, 다른 설도 충분히 소개한다.

series: 단어해체소
title: 짬뽕은 어디서 왔을까
description: |
  중국집 대표 메뉴 짬뽕, 그런데 이 이름은 중국어가 아닙니다.
  나가사키에서 태어난 일본어 '잔폰', 그리고 그 이름의 뿌리를 둘러싼 여러 설을 해체해 봅니다.
  한국 짬뽕이 사실 나가사키 짬뽕과 다른 음식에서 출발했다는 이야기도 함께 담았습니다.
  어원은 설이 여러 개인 경우가 많습니다. 틀린 부분이 있다면 댓글로 알려주세요.
theme: magazine_dark
voice:
  engine: elevenlabs
  name: CYbONFCmQ856BE6N5Cqt
  model: eleven_multilingual_v2
voice_fx: soft
bgm:
  file: bgm/bgm.mp3
  volume_db: -22
  fade_out: 3
speed: 0.95
tags: [어원, 단어의유래, 외래어, 짬뽕, 나가사키, 초마면, 중국집, 상식]

sources:
  - 국립국어원 표준국어대사전 '짬뽕' 항목 (stdict.korean.go.kr)
  - 한국어 위키백과 '짬뽕' 항목과 그 인용 문헌 (경향신문 2017-03-17, 국립국어원 〈우리말 바로 알기〉)
  - 일본어 위키백과 'ちゃんぽん' 항목과 그 인용 문헌 (『日本語源大辞典』, 『デジタル大辞泉』, 『長崎縣紀要』 1907 등)

