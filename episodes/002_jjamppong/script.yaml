    say:
      - 정리해 보면, 짬뽕이라는 이름은 일본어에서 왔지만, 그 일본어의 뿌리는 아직 정설이 없습니다.
      - 그리고 한국의 짬뽕은 음식은 산둥에서, 이름은 나가사키에서 온, 말 그대로 짬뽕 같은 음식인 셈이죠.

