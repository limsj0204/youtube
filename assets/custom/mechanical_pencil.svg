<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 16 224 224">
  <!-- 샤프펜슬: 비스듬히 놓인 모습. 끝에 가는 심, 금속 촉, 고무 그립, 클립, 누름 단추 -->
  <g transform="rotate(-40 128 128)">
    <ellipse cx="128" cy="170" rx="100" ry="6" fill="#000000" opacity="0.15"/>
    <!-- 심 -->
    <rect x="14" y="125" width="16" height="6" rx="2" fill="#3A3A3A"/>
    <!-- 금속 촉 -->
    <path d="M30 122 L58 116 L58 140 L30 134 Z" fill="#C3CBD6"/>
    <path d="M30 128 L58 128 L58 140 L30 134 Z" fill="#98A3B2"/>
    <!-- 고무 그립 -->
    <rect x="58" y="112" width="52" height="32" rx="6" fill="#2F3A48"/>
    <g fill="#435064"><rect x="64" y="112" width="4" height="32"/><rect x="74" y="112" width="4" height="32"/>
      <rect x="84" y="112" width="4" height="32"/><rect x="94" y="112" width="4" height="32"/></g>
    <!-- 몸통 -->
    <rect x="108" y="114" width="108" height="28" rx="5" fill="#2E7DD7"/>
    <rect x="108" y="114" width="108" height="10" rx="5" fill="#5BA3F0"/>
    <!-- 클립 -->
    <path d="M176 106 L222 106 Q228 106 228 112 L228 116 L182 116 Q176 116 176 110 Z" fill="#C3CBD6"/>
    <path d="M182 116 L186 124" stroke="#98A3B2" stroke-width="4" stroke-linecap="round"/>
    <!-- 누름 단추 -->
    <rect x="216" y="118" width="20" height="20" rx="4" fill="#C3CBD6"/>
    <rect x="216" y="118" width="20" height="7" rx="3" fill="#E3E8EE"/>
  </g>
</svg>
