  <path d="M60 112 C80 102 116 96 156 96 C178 96 196 98 210 104
           C196 110 178 110 156 110 C120 110 92 114 66 122 Z" fill="#E6936D"/>
  <path d="M52 174 C76 166 116 164 160 166 C182 167 198 170 210 174
           C192 180 170 182 150 182 C110 184 80 182 58 180 Z" fill="#F3C29E"/>

  <!-- 흰 밑동 -->
  <path d="M40 150 C40 118 58 98 84 94 C74 112 70 134 72 156 C74 170 80 182 88 188
           C72 188 60 186 54 180 C44 172 40 162 40 150 Z" fill="#F7E6CC"/>
  <path d="M50 120 C56 110 64 104 72 100 C66 114 64 128 64 140 C58 136 52 128 50 120 Z" fill="#FFF3DF"/>
  <path d="M46 160 C52 166 60 172 70 176 C64 168 62 160 62 152 C56 154 50 156 46 160 Z" fill="#EBD2B0"/>

  <!-- 초록 잎끝 (물결 모양) -->
  <path d="M196 88 C210 80 226 84 232 96 C240 100 244 112 238 122 C246 130 242 146 232 150
           C236 162 226 174 212 172 C214 160 216 146 216 132 C216 114 208 98 196 88 Z" fill="#6E9A2E"/>
  <path d="M206 96 C218 96 228 104 230 114 C222 112 214 110 208 112 C210 106 208 100 206 96 Z" fill="#8DB93E"/>
  <path d="M214 134 C224 134 232 140 234 148 C226 148 220 146 214 146 Z" fill="#8DB93E"/>

  <!-- 양념이 진하게 밴 자국 -->
  <g fill="#B8301C" opacity="0.9">
    <path d="M98 100 C108 96 118 102 112 110 C104 114 94 108 98 100 Z"/>
    <path d="M150 124 C160 120 170 126 164 134 C156 138 146 132 150 124 Z"/>
    <path d="M118 160 C128 156 138 162 132 170 C124 174 114 168 118 160 Z"/>
    <path d="M182 150 C190 146 198 152 192 158 C186 162 178 156 182 150 Z"/>
  </g>
  <!-- 고춧가루 -->
  <g fill="#8E1A0E">
    <circle cx="92" cy="122" r="2.4"/><circle cx="126" cy="104" r="2"/><circle cx="140" cy="142" r="2.4"/>
    <circle cx="170" cy="104" r="2"/><circle cx="104" cy="148" r="2.2"/><circle cx="188" cy="128" r="2.2"/>
    <circle cx="156" cy="168" r="2"/><circle cx="120" cy="126" r="1.8"/><circle cx="200" cy="112" r="1.8"/>
    <circle cx="84" cy="168" r="2"/><circle cx="174" cy="140" r="1.8"/>
  </g>
  <!-- 실파 -->
  <g fill="#5E9A2A">
    <rect x="106" y="174" width="14" height="4" rx="2" transform="rotate(-10 113 176)"/>
    <rect x="150" y="96" width="12" height="4" rx="2" transform="rotate(14 156 98)"/>
    <rect x="70" y="138" width="12" height="4" rx="2" transform="rotate(-24 76 140)"/>
