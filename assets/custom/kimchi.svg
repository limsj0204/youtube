  <!-- 접시 -->
  <ellipse cx="128" cy="204" rx="112" ry="26" fill="#D9D2C7"/>
  <ellipse cx="128" cy="198" rx="112" ry="26" fill="#F4F0E9"/>
  <ellipse cx="128" cy="198" rx="92" ry="18" fill="#E7E1D7"/>
  <ellipse cx="132" cy="196" rx="80" ry="12" fill="#C2361F" opacity="0.85"/>

  <!-- 김치 몸통 (양념 잎) -->
