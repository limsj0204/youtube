           C222 96 232 112 228 132 C226 156 206 178 168 184
           C130 190 86 190 60 182 C46 176 40 166 40 150 Z" fill="#D8432A"/>
  <!-- 잎 겹 (밝은 줄기 부분이 결을 따라 보임) -->
  <path d="M46 154 C66 140 110 132 168 134 C190 135 208 140 222 146
           C208 150 190 150 168 150 C120 150 80 156 50 166 Z" fill="#F0B48C"/>
